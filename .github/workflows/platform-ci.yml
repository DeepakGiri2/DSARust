# Cloud platform CI: backend (Rust), web (React SPA) and infra (CDK).
#
# Runs on pull requests and on pushes to branches other than main. On main the
# same jobs run as the first stage of platform-deploy.yml (workflow_call), so a
# merge is checked exactly once, right before it deploys to dev.
# The desktop app has its own CI; nothing here builds or tests it, but the
# shared crates/ and content/ trigger this workflow because the API links them.
name: platform-ci

on:
  pull_request:
    paths:
      - backend/**
      - web/**
      - infra/**
      - crates/**
      - content/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/platform-*.yml
  push:
    branches-ignore: [main]
    paths:
      - backend/**
      - web/**
      - infra/**
      - crates/**
      - content/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/platform-*.yml
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dsa
          POSTGRES_PASSWORD: dsa
          POSTGRES_DB: dsa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsa -d dsa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: short
      # #[sqlx::test] creates a scratch database per test on this server.
      DATABASE_URL: postgres://dsa:dsa@localhost:5432/dsa
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: platform-backend
      - name: Use committed sqlx offline data when present
        run: |
          if compgen -G ".sqlx/*.json" > /dev/null || compgen -G "crates/*/.sqlx/*.json" > /dev/null; then
            echo "SQLX_OFFLINE=true" >> "$GITHUB_ENV"
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The production image enables the AWS integrations; lint them too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  runner-sandbox:
    # The sandbox's integration tests need the real toolchains and root (per-
    # job uids, ownership checks); on the host above they skip. Here they run
    # inside the runner image itself, as they will in production.
    name: runner sandbox (in the image, as root)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the sandbox test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/runner.Dockerfile
          target: test
          tags: dsa-runner-test:ci
          load: true
          cache-from: type=gha,scope=dsa-runner
          cache-to: type=gha,scope=dsa-runner,mode=max
      - name: Run the sandbox tests
        run: docker run --rm dsa-runner-test:ci
      - name: Build the image a build without --target gets
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/runner.Dockerfile
          tags: dsa-runner:ci
          load: true
          cache-from: type=gha,scope=dsa-runner
      - name: That image is the runner, not the test image
        run: |
          entrypoint="$(docker image inspect dsa-runner:ci --format '{{json .Config.Entrypoint}}')"
          echo "entrypoint: $entrypoint"
          test "$entrypoint" = '["/usr/local/bin/dsa-runner"]'

  web:
    name: web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: infra (test, cdk synth)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run validate:workflows
      # Offline synth (no AWS credentials): every stage and the optional stacks.
      - run: npx cdk synth -c stage=dev --quiet
      - run: npx cdk synth -c stage=prod --quiet
      - name: cdk synth (prod, custom domain, RDS Proxy, CI role)
        run: >-
          npx cdk synth --quiet
          -c stage=prod
          -c domainName=dsa.example.com
          -c hostedZoneId=Z0123456789ABCDEFGHIJ
          -c hostedZoneName=dsa.example.com
          -c certificateArn=arn:aws:acm:us-east-1:111111111111:certificate/11111111-2222-3333-4444-555555555555
          -c rdsProxy=true
          -c githubOidc=true

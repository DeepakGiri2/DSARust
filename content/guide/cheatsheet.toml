String.valueOf(42)
Integer.parseInt("42")
'''

[[section.row]]
topic = 'compare / equality'
go = '''
s == t          // content
s < t           // lexicographic
'''
cpp = '''
s == t          // content
s < t           // lexicographic
'''
java = '''
s.equals(t)     // NOT ==
s.compareTo(t) < 0
'''

[[section.row]]
topic = 'split / join'
go = '''

# Cross-language syntax cheat sheet: "I know X, show me Y".

[[section]]
name = 'Basics'

[[section.row]]
topic = 'declare variable'
go = '''
x := 5
var y int // zero = 0
'''
cpp = '''
int x = 5;
auto y = 5;
'''
java = '''
int x = 5;
var y = 5; // Java 10+
'''

[[section.row]]
topic = 'function'
go = '''
func add(a, b int) int {
    return a + b
}
'''
cpp = '''
int add(int a, int b) {
    return a + b;
}
'''
java = '''
static int add(int a, int b) {
    return a + b;
}
'''

[[section.row]]
topic = 'multiple return values'
go = '''
func divmod(a, b int) (int, int) {
    return a / b, a % b
}
'''
cpp = '''
pair<int,int> divmod(int a, int b) {
    return {a / b, a % b};
}
// auto [q, r] = divmod(7, 2);
'''
java = '''
int[] divmod(int a, int b) {
    return new int[]{a / b, a % b};
}
'''

[[section.row]]
topic = 'if / else'
go = '''
if x > 0 {
} else if x < 0 {
} else {
}
// with init: if v, ok := m[k]; ok { }
'''
cpp = '''
if (x > 0) {
} else if (x < 0) {
} else {
}
'''
java = '''
if (x > 0) {
} else if (x < 0) {
} else {
}
'''

[[section.row]]
topic = 'while loop'
go = '''
for x > 0 { x-- }   // for IS while
for { }             // infinite
'''
cpp = '''
while (x > 0) x--;
while (true) { }
'''
java = '''
while (x > 0) x--;
while (true) { }
'''

[[section.row]]
topic = 'ternary / conditional'
go = '''
// none — use if
max := a
if b > a { max = b }
'''
cpp = 'int max = a > b ? a : b;'
java = 'int max = a > b ? a : b;'

[[section.row]]
topic = 'null value'
go = 'nil'
cpp = 'nullptr'
java = 'null'

[[section.row]]
topic = 'max / min / abs'
go = '''
max(a, b) // builtin since 1.21
min(a, b)
// abs: if x < 0 { x = -x }
'''
cpp = '''
max(a, b); min(a, b);
abs(x);

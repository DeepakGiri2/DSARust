Math.min(a, b);
Math.abs(x);
'''

[[section.row]]
topic = 'int limits (watch overflow!)'
go = '''
math.MaxInt   // 64-bit on x64
math.MaxInt32 // 2147483647
// int is 64-bit on modern platforms
'''
cpp = '''
INT_MAX  // 2147483647 (32-bit)
LLONG_MAX
// use long long for big sums
'''
java = '''
Integer.MAX_VALUE // 2147483647
Long.MAX_VALUE
// use long for big sums
'''

[[section.row]]
topic = 'print / debug'
go = '''

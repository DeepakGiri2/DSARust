    x -> x * 2;
// or a helper method
'''

[[section]]
name = 'Binary search helpers'

[[section.row]]
topic = 'first index >= x (lower bound)'
go = '''
i := sort.SearchInts(nums, x)
// i == len(nums) if every value is < x
'''
cpp = '''
auto it = lower_bound(v.begin(), v.end(), x);
int i = it - v.begin();
'''
java = '''
// Arrays.binarySearch gives ANY match, not
// the first — write the loop yourself:
int lo = 0, hi = n;
while (lo < hi) {
    int m = (lo + hi) / 2;
    if (nums[m] < x) lo = m + 1; else hi = m;
}
'''

[[section.row]]
topic = 'first index > x (upper bound)'
go = 'i := sort.SearchInts(nums, x+1)'
cpp = '''
auto it = upper_bound(v.begin(), v.end(), x);
'''
java = '''
// same loop with <= instead of <
if (nums[m] <= x) lo = m + 1; else hi = m;
'''

[[section.row]]
topic = 'count of x in a sorted array'
go = '''
hi := sort.SearchInts(nums, x+1)
lo := sort.SearchInts(nums, x)
count := hi - lo
'''
cpp = '''
auto [a, b] = equal_range(v.begin(),
                          v.end(), x);
int count = b - a;
'''
java = 'int count = upper(x) - lower(x);'

[[section.row]]
topic = 'binary search on the answer'
go = '''
lo, hi := 1, maxAnswer
for lo < hi {
    mid := lo + (hi-lo)/2
    if feasible(mid) { hi = mid } else { lo = mid + 1 }
}
// lo is the smallest feasible answer
'''
cpp = '''
int lo = 1, hi = maxAnswer;
while (lo < hi) {
    int mid = lo + (hi - lo) / 2;
    if (feasible(mid)) hi = mid;
    else lo = mid + 1;
}
'''
java = '''
int lo = 1, hi = maxAnswer;
while (lo < hi) {
    int mid = lo + (hi - lo) / 2;
    if (feasible(mid)) hi = mid;
    else lo = mid + 1;
}
'''

[[section.row]]
topic = 'safe midpoint'
go = 'mid := lo + (hi-lo)/2 // (lo+hi)/2 can overflow'
cpp = 'int mid = lo + (hi - lo) / 2;'
java = '''
int mid = lo + (hi - lo) / 2;
// or: (lo + hi) >>> 1
'''

[[section]]
name = 'Math & overflow'

[[section.row]]
topic = 'integer division & remainder'
go = '''
7 / 2   // 3
-7 / 2  // -3  (truncates toward zero)
-7 % 2  // -1  (sign of the dividend)
'''
cpp = '''
7 / 2;   // 3
-7 / 2;  // -3
-7 % 2;  // -1
'''
java = '''
7 / 2;   // 3
-7 / 2;  // -3
-7 % 2;  // -1
Math.floorMod(-7, 2); // 1
'''

[[section.row]]
topic = 'positive remainder'
go = 'r := ((x % m) + m) % m'
cpp = 'int r = ((x % m) + m) % m;'
java = 'int r = Math.floorMod(x, m);'

[[section.row]]
topic = 'ceiling division'
go = 'up := (a + b - 1) / b // a, b > 0'
cpp = 'int up = (a + b - 1) / b;'
java = '''
int up = (a + b - 1) / b;
// or Math.ceilDiv(a, b) in Java 18+
'''

[[section.row]]
topic = 'gcd / lcm'
go = '''
func gcd(a, b int) int {
    for b != 0 { a, b = b, a%b }
    return a
}
lcm := a / gcd(a, b) * b // divide first
'''
cpp = '''
int g = __gcd(a, b);   // or std::gcd
long long l = 1LL * a / g * b;
'''
java = '''
// no builtin for int — write Euclid
long l = (long) a / gcd(a, b) * b;
'''

[[section.row]]
topic = 'avoid multiply overflow'
go = '''
// int is 64-bit: 2 * 10^9 * 2 is fine.
// Still guard against 10^18 products.
'''
cpp = '''
long long p = 1LL * a * b; // cast FIRST
// (long long)(a * b) is already wrong
'''
java = '''
long p = (long) a * b;     // cast FIRST
// (long)(a * b) is already wrong
'''

[[section.row]]
topic = 'power / sqrt'
go = '''
math.Pow(2, 10)          // float64!
int(math.Sqrt(float64(n)))
1 << 10                  // integer power of two
'''
cpp = '''
pow(2, 10);              // double
(int) sqrt((double) n);
1 << 10;
'''
java = '''
Math.pow(2, 10);         // double
(int) Math.sqrt(n);
1 << 10;
'''

[[section.row]]
topic = 'random number'
go = '''
rand.Intn(n)      // 0 .. n-1
rand.Shuffle(len(a), func(i, j int) {
    a[i], a[j] = a[j], a[i]
})
'''
cpp = '''
rand() % n;       // 0 .. n-1
shuffle(v.begin(), v.end(),
        mt19937(random_device{}()));
'''
java = '''
new Random().nextInt(n); // 0 .. n-1
Collections.shuffle(list);
'''

[[section]]
name = 'Bit tricks'

[[section.row]]
topic = 'test / set / clear bit i'
go = '''
x&(1<<i) != 0   // test
x |= 1 << i     // set
x &^= 1 << i    // clear (Go: AND NOT)
x ^= 1 << i     // flip
'''
cpp = '''
x & (1 << i);   // test
x |= 1 << i;    // set
x &= ~(1 << i); // clear
x ^= 1 << i;    // flip
'''
java = '''
(x & (1 << i)) != 0; // test
x |= 1 << i;         // set
x &= ~(1 << i);      // clear
x ^= 1 << i;         // flip
'''

[[section.row]]
topic = 'count set bits'
go = 'bits.OnesCount(uint(x))'
cpp = '__builtin_popcount(x) // popcountll for 64-bit'
java = 'Integer.bitCount(x)'

[[section.row]]
topic = 'lowest set bit / drop it'
go = '''
low := x & -x    // isolate lowest 1
x &= x - 1       // drop lowest 1
'''
cpp = '''
int low = x & -x;
x &= x - 1;
'''
java = '''
int low = x & -x;   // Integer.lowestOneBit(x)
x &= x - 1;
'''

[[section.row]]
topic = 'power of two / parity'
go = '''
x > 0 && x&(x-1) == 0  // power of two
x&1 == 1               // odd (x >= 0)
'''
cpp = '''
x > 0 && (x & (x - 1)) == 0;
x & 1;                 // careful with negatives
'''
java = '''
x > 0 && (x & (x - 1)) == 0;
(x & 1) != 0;          // not == 1: negatives
'''

[[section.row]]
topic = 'iterate every subset of a set'
go = '''
for mask := 0; mask < 1<<n; mask++ {
    for i := 0; i < n; i++ {
        if mask&(1<<i) != 0 { /* i is in */ }
    }
}
'''
cpp = '''
for (int mask = 0; mask < (1 << n); mask++)
    for (int i = 0; i < n; i++)
        if (mask & (1 << i)) { /* i is in */ }
'''
java = '''
for (int mask = 0; mask < (1 << n); mask++)
    for (int i = 0; i < n; i++)
        if ((mask & (1 << i)) != 0) { }
'''

[[section.row]]
topic = 'shift right: signed vs unsigned'
go = '''
x >> 1   // arithmetic for int,
         // logical for uint
'''
cpp = '''
x >> 1;             // arithmetic if signed
(unsigned)x >> 1;   // logical
'''
java = '''
x >> 1;   // arithmetic (keeps the sign)
x >>> 1;  // logical (fills with 0)
'''


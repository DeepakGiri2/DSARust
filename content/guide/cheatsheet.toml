    int val;
    ListNode next;
}
ListNode n = new ListNode();
n.next
'''

[[section.row]]
topic = 'pair / tuple'
go = '''
// use a small struct or [2]int
p := [2]int{r, c}
'''
cpp = '''
pair<int,int> p = {r, c};
p.first; p.second;
auto [a, b] = p;
'''
java = '''
// use int[2] (arrays)
int[] p = {r, c};
p[0]; p[1];
'''

[[section.row]]
topic = 'lambda / closure'

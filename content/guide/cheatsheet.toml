seen[x] = true
if seen[x] { }
'''
cpp = '''
unordered_set<int> seen;
seen.insert(x);
if (seen.count(x)) { }
'''
java = '''
Set<Integer> seen = new HashSet<>();
seen.add(x);
if (seen.contains(x)) { }
'''

[[section.row]]
topic = 'sorted map (ordered keys)'
go = '''
// none — sort keys manually:
keys := []int{}
for k := range m { keys = append(keys, k) }
sort.Ints(keys)
'''
cpp = '''
map<int, int> m; // red-black tree
// O(log n) ops, sorted iteration
'''
java = '''
TreeMap<Integer, Integer> m =
    new TreeMap<>();
m.firstKey(); m.floorKey(x);
'''

[[section]]
name = 'Stack, queue, deque, heap'

[[section.row]]
topic = 'stack push / peek / pop'
go = '''
st := []int{}
st = append(st, x)
top := st[len(st)-1]
st = st[:len(st)-1]
'''
cpp = '''
stack<int> st;
st.push(x);
int top = st.top();
st.pop(); // void!
'''
java = '''
Deque<Integer> st =
    new ArrayDeque<>();
st.push(x);
int top = st.peek();
st.pop();
'''

[[section.row]]
topic = 'queue enqueue / dequeue'
go = '''
q := []int{}
q = append(q, x)
front := q[0]
q = q[1:]
'''
cpp = '''
queue<int> q;
q.push(x);
int front = q.front();
q.pop();
'''
java = '''
Queue<Integer> q =
    new ArrayDeque<>();
q.offer(x);
int front = q.poll();
'''

[[section.row]]
topic = 'min-heap'
go = '''
// container/heap: implement
// Len/Less/Swap/Push/Pop
heap.Init(h)
heap.Push(h, x)
min := heap.Pop(h).(int)
'''
cpp = '''
priority_queue<int,
    vector<int>, greater<int>> pq;
pq.push(x);
int min = pq.top(); pq.pop();
'''
java = '''
Queue<Integer> pq =
    new PriorityQueue<>();
pq.offer(x);
int min = pq.poll();
'''

[[section.row]]
topic = 'max-heap'
go = '''
// same, but Less returns >
// or push negated values
'''
cpp = '''
priority_queue<int> pq;
// max by DEFAULT in C++
'''
java = '''
new PriorityQueue<>(
    Comparator.reverseOrder());
'''


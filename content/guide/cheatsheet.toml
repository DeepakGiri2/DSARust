[[section]]
name = 'Language gotchas'

[[section.row]]
topic = 'compare boxed integers'
go = '// no boxing — == is always value equality'
cpp = '// no boxing — == is always value equality'
java = '''
Integer a = 200, b = 200;
a == b        // FALSE (outside -128..127)
a.equals(b)   // true
// use int, not Integer, in hot loops
'''

[[section.row]]
topic = 'size of an empty container'
go = 'len(nums) - 1 // -1, an int: safe'
cpp = '''
nums.size() - 1  // HUGE: size_t is unsigned
// use (int)nums.size() - 1
'''
java = 'nums.length - 1 // -1, an int: safe'

[[section.row]]
topic = 'copy vs reference'
go = '''
b := a          // slice: SHARES the array
c := append([]int{}, a...) // real copy
'''
cpp = '''
auto b = a;     // vector: real copy
auto& r = a;    // reference
'''
java = '''
int[] b = a;              // same array!
int[] c = a.clone();      // copy
List<Integer> d = new ArrayList<>(list);
'''

[[section.row]]
topic = 'map iteration order'
go = '''
// RANDOMISED on purpose — never rely on it
keys := make([]int, 0, len(m))
for k := range m { keys = append(keys, k) }
sort.Ints(keys)
'''
cpp = '''
// unordered_map: unspecified
// map: sorted by key
'''

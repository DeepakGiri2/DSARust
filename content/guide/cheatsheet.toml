String.join("-", parts);
'''

[[section]]
name = 'Hash map & set'

[[section.row]]
topic = 'create map'
go = 'm := map[string]int{}'
cpp = 'unordered_map<string, int> m;'
java = '''
Map<String, Integer> m =
    new HashMap<>();
'''

[[section.row]]
topic = 'insert / lookup / missing key'
go = '''
m["a"] = 1
v, ok := m["a"] // ok=false if absent
// m["absent"] → 0 silently
'''
cpp = '''
m["a"] = 1;
if (m.count("a")) v = m["a"];
// m["absent"] INSERTS 0!
'''
java = '''
m.put("a", 1);
int v = m.getOrDefault("a", 0);
// m.get("absent") → null
'''

[[section.row]]
topic = 'count frequencies'
go = '''
for _, c := range s {
    m[c]++
}
'''
cpp = '''
for (char c : s)
    m[c]++;
'''
java = '''
for (char c : s.toCharArray())
    m.merge(c, 1, Integer::sum);
'''

[[section.row]]
topic = 'delete / iterate'
go = '''
delete(m, "a")
for k, v := range m { }
'''
cpp = '''
m.erase("a");
for (auto& [k, v] : m) { }
'''
java = '''
m.remove("a");
for (var e : m.entrySet()) {
    e.getKey(); e.getValue();
}
'''

[[section.row]]
topic = 'set: create / add / contains'
go = '''

[[topic]]
id = 'heap'
title = 'Heap / Priority Queue'
kind = 'structure'
emoji = '⛰️'
what = [
  "A heap answers one question fast: \"what is the smallest (or largest) element right now?\" It is a complete binary tree stored flat in an array — no pointers. With 0-based indexing, node i has children at 2i+1 and 2i+2 and parent at (i-1)/2. The heap property: every parent ≤ its children (min-heap). Note that's much weaker than sorted — only the root is guaranteed to be the minimum.",
  'Push appends at the end and "bubbles up" while smaller than its parent; pop swaps the root with the last element, removes it, and "sifts down". Both walk one root-to-leaf path, so O(log n). Peeking the top is O(1).',
  'The Top-K pattern: keep a min-heap of size k while streaming n elements; if a new element beats the top, pop-and-push. n operations on a k-sized heap = O(n log k), far better than sorting when k ≪ n. Heaps also drive "merge k sorted lists", scheduling problems, and Dijkstra.',
]
notes = [
  'Default direction differs! C++ priority_queue is a MAX-heap; Java PriorityQueue and Go container/heap conventions are MIN-heaps. Flipping this is the most common heap bug when switching languages.',
  'Max-heap from a min-heap: negate values on push and pop, or invert the comparator.',
  'Array math (0-based): children of i are 2i+1, 2i+2; parent is (i-1)/2. With 1-based indexing it is 2i, 2i+1 and i/2 — know which convention your source uses.',
  'Java comparator (a, b) -> a - b can overflow for extreme values; Integer.compare(a, b) is safe.',
]

[topic.syntax]
go = '''
// container/heap needs boilerplate: implement heap.Interface
type MinHeap []int
func (h MinHeap) Len() int            { return len(h) }
func (h MinHeap) Less(i, j int) bool  { return h[i] < h[j] }
func (h MinHeap) Swap(i, j int)       { h[i], h[j] = h[j], h[i] }
func (h *MinHeap) Push(x any)         { *h = append(*h, x.(int)) }
func (h *MinHeap) Pop() any {
    old := *h; n := len(old); x := old[n-1]; *h = old[:n-1]; return x
}
h := &MinHeap{5, 2, 8}
heap.Init(h)                   // O(n) heapify
heap.Push(h, 1)
top := (*h)[0]                 // peek
smallest := heap.Pop(h).(int)
'''
cpp = '''
priority_queue<int> maxpq;             // MAX-heap by default!
priority_queue<int, vector<int>, greater<int>> minpq; // min-heap
minpq.push(5);
int top = minpq.top();          // peek
minpq.pop();                    // void
// custom order (e.g. by pair.first):
auto cmp = [](auto& a, auto& b){ return a.first > b.first; };
priority_queue<pair<int,int>, vector<pair<int,int>>, decltype(cmp)> pq(cmp);
'''
java = '''
Queue<Integer> minpq = new PriorityQueue<>();          // MIN-heap by default
Queue<Integer> maxpq = new PriorityQueue<>(Comparator.reverseOrder());
minpq.offer(5);
int top = minpq.peek();
int popped = minpq.poll();
// custom order:
Queue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);
'''


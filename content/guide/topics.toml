[[topic]]
id = 'dp'
title = 'Dynamic Programming'
kind = 'technique'
emoji = '🧩'
what = [
  'DP applies when a problem has (1) optimal substructure — the answer builds from answers to smaller subproblems — and (2) overlapping subproblems — naive recursion would solve the same subproblem many times. Fibonacci is the toy example: fib(n) recomputes fib(n-2) exponentially many times; caching collapses the work to O(n).',
  'Two equivalent implementations. Top-down (memoization): write the recursion, add a cache keyed by the arguments, return the cached value on re-entry. Bottom-up (tabulation): figure out the dependency order and fill a table from the base cases upward with a loop. Same asymptotics; bottom-up avoids recursion depth and often lets you shrink space (if dp[i] only reads dp[i-1] and dp[i-2], keep two variables — Climbing Stairs, House Robber).',
  'The craft is defining the state: "dp[i] = best answer for the first i items" (1-D), "dp[i][j] = answer for prefix i of A vs prefix j of B" (classic 2-D, e.g. Longest Common Subsequence), "dp[amount] = fewest coins to make amount" (value-indexed, Coin Change). Then the recurrence: how does state depend on smaller states? Write the recurrence in words before code. A common convention: size the table n+1 and let index i mean "first i elements", so dp[0] is the empty prefix and there are no i-1 underflows.',
]
notes = [
  'The n+1-sized table with dp[0] = base case ("zero items / empty prefix") eliminates most off-by-one bugs: dp[i] then refers to the FIRST i elements, i.e. element i-1 is the newest.',
  'Use a sentinel like amount+1 for "impossible", not Integer.MAX_VALUE — MAX_VALUE + 1 overflows to negative.',
  'Recite the recurrence in words first: "ways to reach step i = ways to reach i-1 + ways to reach i-2". If you can say it, you can code it.',
  'Memo keys must capture the FULL state — if the recursion takes (i, j, canBuy), all three belong in the key.',
]

[topic.syntax]
go = '''
// bottom-up: Coin Change (fewest coins for amount)
dp := make([]int, amount+1)
for i := 1; i <= amount; i++ { dp[i] = amount + 1 } // "infinity"
for i := 1; i <= amount; i++ {
    for _, c := range coins {
        if c <= i && dp[i-c]+1 < dp[i] { dp[i] = dp[i-c] + 1 }
    }
}
// top-down: memo := map[int]int{}, check before recursing
'''
cpp = '''
vector<int> dp(amount + 1, amount + 1); // "infinity"
dp[0] = 0;
for (int i = 1; i <= amount; i++)
    for (int c : coins)
        if (c <= i) dp[i] = min(dp[i], dp[i - c] + 1);
// top-down: unordered_map<int,int> memo; or vector<int> memo(n, -1)
'''
java = '''
int[] dp = new int[amount + 1];
Arrays.fill(dp, amount + 1);            // "infinity"
dp[0] = 0;
for (int i = 1; i <= amount; i++)
    for (int c : coins)
        if (c <= i) dp[i] = Math.min(dp[i], dp[i - c] + 1);
// top-down: Integer[] memo = new Integer[n]; null = not computed
'''


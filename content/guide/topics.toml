[[topic]]
id = 'intervals'
title = 'Intervals'
kind = 'structure'
emoji = '📅'
what = [
  'Interval problems ([start, end] pairs — meetings, bookings, ranges) nearly all yield to one preprocessing step: sort by start. After sorting, only NEIGHBORING intervals can overlap-merge, so a single linear pass suffices — total O(n log n) for the sort plus O(n) for the sweep.',
  'The overlap test between a and b (with a.start ≤ b.start): they overlap iff b.start ≤ a.end (touching counts, depending on the problem: for closed intervals [1,3] and [3,5] usually merge; if endpoints are exclusive, use <). The merged interval is [a.start, max(a.end, b.end)] — the max matters because a may fully contain b.',
  "Merge template: sort, keep a current interval, and for each next one either extend cur.end = max(cur.end, next.end) (overlap) or emit cur and move on (gap). The Meeting Rooms II counting trick: split into start events (+1) and end events (−1), sort both, sweep — the running sum's peak is the number of rooms needed.",
]
notes = [
  'Always clarify closed vs open endpoints: do [1,3] and [3,5] overlap? For merging usually yes (<=); for non-overlapping-count problems usually no (<).',
  'Take max(cur.end, next.end) when merging — [1,10] then [2,3] must stay ending at 10.',
  'Sorting by END time instead is the greedy key for "maximum number of non-overlapping intervals".',
]

[topic.syntax]
go = '''
sort.Slice(intervals, func(i, j int) bool {
    return intervals[i][0] < intervals[j][0] // by start
})
merged := [][]int{intervals[0]}
for _, iv := range intervals[1:] {
    last := merged[len(merged)-1]
    if iv[0] <= last[1] {          // overlap
        if iv[1] > last[1] { last[1] = iv[1] }
    } else {
        merged = append(merged, iv)
    }
}
'''
cpp = '''
sort(intervals.begin(), intervals.end()); // sorts by [0] then [1]
vector<vector<int>> merged{intervals[0]};
for (int i = 1; i < intervals.size(); i++) {
    auto& last = merged.back();
    if (intervals[i][0] <= last[1])
        last[1] = max(last[1], intervals[i][1]);
    else
        merged.push_back(intervals[i]);
}
'''
java = '''
Arrays.sort(intervals, (a, b) -> a[0] - b[0]);
List<int[]> merged = new ArrayList<>();
merged.add(intervals[0]);
for (int i = 1; i < intervals.length; i++) {
    int[] last = merged.get(merged.size() - 1);
    if (intervals[i][0] <= last[1])
        last[1] = Math.max(last[1], intervals[i][1]);
    else
        merged.add(intervals[i]);
}
'''


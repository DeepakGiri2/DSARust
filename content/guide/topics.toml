[[topic]]
id = 'prefixsum'
title = 'Prefix Sums & Difference Arrays'
kind = 'technique'
emoji = '➕'
what = [
  'A prefix sum turns "sum of a range" from a loop into a subtraction. Build prefix[i] = the sum of the first i values — note the i, not i+1, so prefix[0] = 0 means "the sum of nothing" — and any range sum is prefix[right+1] − prefix[left]. That extra leading zero is what removes every special case for a range starting at index 0.',
  'The same trick runs in reverse. A difference array records only where a value changes: adding v across [l, r] is diff[l] += v and diff[r+1] -= v, two writes instead of r − l + 1. A running sum at the end reconstructs the final array. Prefix sums answer many queries on fixed data; difference arrays apply many updates before one final read.',
  'The pattern generalises past sums. Prefix XOR answers range-XOR queries; prefix counts answer "how many vowels in this substring"; 2-D prefix sums answer rectangle queries with four lookups by inclusion–exclusion. Combined with a hash map, prefix sums solve the whole "count subarrays with property X" family — including sum equals k, and sum divisible by k, where the key is the remainder rather than the sum.',
]
notes = [
  'Size the prefix array n+1, not n. Almost every off-by-one here comes from trying to make n slots work.',
  'sum(left..right) inclusive is prefix[right+1] − prefix[left]. Write it down once and stop re-deriving it under pressure.',
  "Prefix sums overflow sooner than the input suggests: 10⁵ values of 10⁹ needs a 64-bit accumulator (long in Java, long long in C++; Go's int is already 64-bit).",
  'Negative values are fine for prefix sums but break the sliding-window alternative — that is usually the tell for which technique a problem wants.',
  'Remainders of negative numbers are negative in Go, C++ and Java. Normalise with ((x % k) + k) % k before using one as a map key.',
  'The structure is immutable: one element update invalidates the whole tail. If updates interleave with queries, you want a Fenwick or segment tree.',
]

[topic.syntax]
go = '''
// prefix sums
prefix := make([]int, len(nums)+1)
for i, x := range nums { prefix[i+1] = prefix[i] + x }
sum := prefix[r+1] - prefix[l]        // nums[l..r] inclusive

// difference array: +v on [l, r]
diff := make([]int, n+1)
diff[l] += v
diff[r+1] -= v
run := 0
for i := 0; i < n; i++ { run += diff[i]; out[i] = run }

// count subarrays summing to k
seen := map[int]int{0: 1}
sum, count := 0, 0
for _, x := range nums {
    sum += x
    count += seen[sum-k]
    seen[sum]++
}
'''

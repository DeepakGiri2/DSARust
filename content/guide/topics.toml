[[topic]]
id = 'bits'
title = 'Bit Manipulation'
kind = 'structure'
emoji = '💡'
what = [
  'An int IS an array of bits — 32 or 64 boolean flags packed into one machine word, indexed 0 (least significant, rightmost) upward. Bit i has value 2^i. The operators: & (AND, both 1), | (OR, either 1), ^ (XOR, exactly one is 1), << and >> (shift = multiply/divide by 2), and ~ (NOT — ^ in Go).',
  "The toolbox: read bit i with (n >> i) & 1; set it with n | (1 << i); clear it with n & ~(1 << i); toggle with n ^ (1 << i). Two magic tricks carry most problems: n & (n-1) clears the LOWEST set bit (loop it to count bits — Hamming weight, or test power-of-two: n & (n-1) == 0), and XOR's cancellation a ^ a = 0, a ^ 0 = a means XOR-ing a whole array leaves exactly the element that appears once (Single Number).",
  'XOR is also a full adder without carry: a ^ b is the sum bits, (a & b) << 1 is the carries — loop until the carry is 0 and you have added two numbers with no + operator (Sum of Two Integers).',
]
notes = [
  'Bit positions are 0-based from the RIGHT (least significant). Bit 31 of a 32-bit int is the sign bit.',
  "Negative numbers are two's complement: -n == ~n + 1. Right-shifting a negative with >> keeps the sign (arithmetic shift); Java has >>> for logical shift, Go/C++ get it by casting to unsigned.",
  'Go has no ~ operator: unary ^n is NOT, and n &^ m is AND-NOT (clear the bits of m in n).',
  'Shifting by ≥ the type width (1 << 32 on int32) is undefined/wraps — mask shift amounts when they are computed.',
]

[topic.syntax]
go = '''
bit := (n >> i) & 1            // read bit i
n |= 1 << i                    // set bit i
n &^= 1 << i                   // clear (Go's AND-NOT operator)
n ^= 1 << i                    // toggle
count := 0
for x := n; x != 0; x &= x - 1 { count++ } // popcount
// also: bits.OnesCount(uint(n)) from math/bits
'''
cpp = '''
int bit = (n >> i) & 1;
n |= 1 << i;                   // set
n &= ~(1 << i);                // clear
n ^= 1 << i;                   // toggle
int count = __builtin_popcount(n); // GCC/Clang builtin
// portable: for (; n; n &= n - 1) count++;
'''
java = '''
int bit = (n >> i) & 1;
n |= 1 << i;                   // set
n &= ~(1 << i);                // clear
n ^= 1 << i;                   // toggle
int count = Integer.bitCount(n);
// >>> is unsigned shift (fills 0s); >> keeps the sign bit
'''


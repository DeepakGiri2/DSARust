[[topic]]
id = 'graph'
title = 'Graph (adjacency list)'
kind = 'structure'
emoji = '🕸️'
what = [
  'A graph is nodes plus edges — the general "things and connections" structure (trees are just graphs with no cycles and one root). The standard representation is the adjacency list: for each node, the list of its neighbors. Space O(V+E), iterate-neighbors fast; an adjacency matrix (V×V grid) costs O(V²) space but answers "is there an edge u–v?" in O(1). Interviews almost always want the list.',
  'The two traversals: DFS dives deep (recursion or explicit stack) — good for connectivity, counting components, cycle detection; BFS expands in rings via a queue — the only one that finds shortest paths in unweighted graphs. Both must track visited nodes, or cycles loop forever. Both visit each node and edge once: O(V+E).',
  "Directed graphs add topological sort: an ordering where every edge points forward, which exists iff there is no cycle (Course Schedule). Kahn's algorithm: compute in-degrees, repeatedly take a node with in-degree 0, decrement its neighbors. If you process fewer than V nodes, there is a cycle. Alternatively DFS with three colors (unvisited / in-progress / done) — meeting an in-progress node means a cycle.",
]
notes = [
  'Nodes are usually labeled 0 … n-1, so a plain array/slice of lists works; use a map only when labels are sparse or non-integer.',
  'Undirected edge = add it in BOTH directions. Forgetting the second direction is the top graph-building bug.',
  'Mark visited when you ENQUEUE in BFS (not when you dequeue) — otherwise the same node enters the queue multiple times.',
  'Recursion depth can hit V — for huge graphs prefer iterative DFS with an explicit stack (especially in languages with small default stacks).',
]

[topic.syntax]

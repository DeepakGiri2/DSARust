[[topic]]
id = 'tree'
title = 'Binary Tree & BST'
kind = 'structure'
emoji = '🌳'
what = [
  'A binary tree is a linked structure where each node points to up to two children (left, right). Height h is the longest root-to-leaf path; a balanced tree keeps h ≈ log₂(n), a degenerate one (every node has one child) is effectively a linked list with h = n. Nearly every tree bound is written in terms of h for exactly this reason.',
  "Traversals: DFS goes deep first, in three flavors defined by when you visit the node relative to recursing — preorder (node, left, right), inorder (left, node, right), postorder (left, right, node). BFS (level order) uses a queue and processes level by level. Most tree solutions are one traversal plus a few lines: \"max depth\" is postorder (need children's answers first), \"serialize\" is preorder, \"level averages\" is BFS.",
  'A Binary Search Tree adds the ordering rule: everything in the left subtree < node < everything in the right subtree — recursively, for ALL descendants, not just direct children. That makes search/insert O(h), and gives the killer property: inorder traversal of a BST visits values in sorted order (this solves "k-th smallest" instantly). Validating a BST requires passing down (min, max) bounds — checking only parent vs child is the famous wrong answer.',
]
notes = [
  'The nil/null base case comes first in every recursive tree function — it is both the recursion floor and the null-safety check.',
  'Think in subproblems: "what do I need from my children to answer for myself?" — that decides pre/in/postorder for you.',
  'BST validation: pass (low, high) bounds down; node.Val must be strictly inside. Duplicates policy depends on the problem statement.',
  'LeetCode serializes trees level by level with null gaps: [3,9,20,null,null,15,7] — indices are NOT the parent/child formula unless the tree is complete (that formula belongs to heaps).',
]

[topic.syntax]
go = '''
type TreeNode struct {
    Val         int
    Left, Right *TreeNode
}
func dfs(node *TreeNode) int {
    if node == nil { return 0 }      // base case FIRST
    l, r := dfs(node.Left), dfs(node.Right)
    return 1 + max(l, r)             // postorder combine
}
// BFS: queue := []*TreeNode{root}, snapshot len(queue) per level
'''
cpp = '''
struct TreeNode {
    int val;
    TreeNode *left, *right;
    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}
};
int dfs(TreeNode* node) {
    if (!node) return 0;
    return 1 + max(dfs(node->left), dfs(node->right));
}
// BFS: queue<TreeNode*> q; q.push(root);
'''
java = '''
class TreeNode {
    int val;
    TreeNode left, right;
    TreeNode(int x) { val = x; }
}
int dfs(TreeNode node) {
    if (node == null) return 0;
    return 1 + Math.max(dfs(node.left), dfs(node.right));
}
// BFS: Queue<TreeNode> q = new ArrayDeque<>(); q.offer(root);
'''

[[topic.complexity]]
op = 'search / insert / delete in BST'
big = 'O(h)'
note = 'O(log n) balanced, O(n) degenerate'

[[topic.complexity]]
op = 'any full traversal (DFS / BFS)'
big = 'O(n)'
note = 'every node once'

[[topic.complexity]]
op = 'space (recursion / queue)'
big = 'O(h) DFS · O(w) BFS'
note = 'w = widest level, up to n/2'

[[topic.complexity]]
op = 'inorder of BST'
big = 'O(n)'

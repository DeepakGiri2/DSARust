[[topic]]
id = 'trie'
title = 'Trie (prefix tree)'
kind = 'structure'
emoji = '🌲'
what = [
  "A trie stores strings character by character down a tree: the root is the empty string and each edge adds one character, so all words sharing a prefix share a path. A word's membership is marked with an end-of-word flag on its final node — \"car\" can exist inside \"card\" without confusion.",
  "Every operation walks one node per character: insert, exact search, and — the trie's superpower — startsWith(prefix), all O(L) where L is the word length, regardless of how many words are stored. A hash set can check exact membership, but only a trie answers prefix questions cheaply, which is why it powers autocomplete and word-search puzzles.",
  "Children are usually a 26-slot array for lowercase a–z (index = c - 'a') or a hash map for general alphabets. Word Search II shows the pattern at full power: walk the grid and the trie simultaneously, pruning any path the trie says leads nowhere.",
]
notes = [
  "The children index is 0-based over the alphabet: c - 'a' maps 'a'→0 … 'z'→25. Uppercase or digits need a bigger array or a map.",
  'search vs startsWith differ by ONE line: search requires isEnd on the final node, startsWith just requires the path to exist.',
  'The root node represents the empty string and holds no character itself.',
]

[topic.syntax]
go = '''
type Trie struct {
    children [26]*Trie
    isEnd    bool
}
func (t *Trie) Insert(word string) {
    cur := t
    for i := 0; i < len(word); i++ {
        c := word[i] - 'a'
        if cur.children[c] == nil { cur.children[c] = &Trie{} }
        cur = cur.children[c]
    }
    cur.isEnd = true
}
'''
cpp = '''
struct Trie {
    Trie* children[26] = {};
    bool isEnd = false;
    void insert(const string& word) {
        Trie* cur = this;
        for (char ch : word) {
            int c = ch - 'a';
            if (!cur->children[c]) cur->children[c] = new Trie();
            cur = cur->children[c];
        }
        cur->isEnd = true;
    }
};
'''
java = '''
class Trie {
    Trie[] children = new Trie[26];
    boolean isEnd = false;
    void insert(String word) {
        Trie cur = this;
        for (char ch : word.toCharArray()) {
            int c = ch - 'a';
            if (cur.children[c] == null) cur.children[c] = new Trie();
            cur = cur.children[c];
        }
        cur.isEnd = true;
    }
}
'''


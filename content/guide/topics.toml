[[topic]]
id = 'slidingwindow'
title = 'Sliding Window'
kind = 'technique'
emoji = '🪟'
what = [
  'Sliding window is two pointers where [left, right] brackets a contiguous subarray/substring, plus running state describing the window (a sum, a char-count map, a distinct counter). Instead of recomputing each window from scratch (O(n·k)), you UPDATE the state as elements enter on the right and leave on the left — O(1) per move, O(n) total, because each index enters once and leaves once.',
  'Variable-size template (the common one): for each right, add s[right] to the state; while the window is INVALID (repeat char, sum too big, too many distinct), remove s[left] and left++; then the window is valid and you record best = max(best, right-left+1). Longest Substring Without Repeating Characters is the canonical example.',
  'Fixed-size windows (size k) are simpler: slide both ends together, add the entering element, remove the leaving one. Best Time to Buy/Sell Stock is a disguised window: keep the min price seen (left side) and try each day as the sell (right side).',
]
notes = [
  'Window size = right - left + 1 (both ends inclusive). Off-by-one here is the classic bug.',
  'The shrink loop is `while`, not `if` — one entering element can invalidate the window by more than one step.',
  'Only works when the answer is a CONTIGUOUS run; subsequences (gaps allowed) need DP instead.',
]

[topic.syntax]
go = '''
window := map[byte]bool{}      // window state
best, l := 0, 0
for r := 0; r < len(s); r++ {
    for window[s[r]] {          // shrink until valid
        delete(window, s[l]); l++
    }
    window[s[r]] = true
    if r-l+1 > best { best = r - l + 1 }
}
'''
cpp = '''
unordered_set<char> window;
int best = 0, l = 0;
for (int r = 0; r < s.size(); r++) {
    while (window.count(s[r])) { window.erase(s[l]); l++; }
    window.insert(s[r]);
    best = max(best, r - l + 1);
}
'''
java = '''
Set<Character> window = new HashSet<>();
int best = 0, l = 0;
for (int r = 0; r < s.length(); r++) {
    while (window.contains(s.charAt(r))) { window.remove(s.charAt(l)); l++; }
    window.add(s.charAt(r));
    best = Math.max(best, r - l + 1);
}
'''


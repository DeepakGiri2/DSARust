[[topic]]
id = 'toposort'
title = 'Topological Sort'
kind = 'technique'
emoji = '🪜'
what = [
  'A topological order lists the vertices of a directed graph so that every edge points forwards. It exists if and only if the graph has no cycle — which is why one algorithm answers both "in what order can I do these tasks?" and "is this set of dependencies impossible?".',
  "Kahn's algorithm is the BFS form: count the edges pointing into each vertex, start with the vertices whose count is zero, and each time one is emitted decrement its neighbours and enqueue any that reach zero. If fewer than n vertices come out, the ones left behind are exactly the vertices trapped in a cycle. The DFS form pushes each vertex after its descendants finish, producing the reverse order, and detects a cycle by meeting a vertex that is still on the recursion stack.",
  'Most of the difficulty is upstream of the algorithm: turning the input into a graph. Course pairs, alien-alphabet letter comparisons, build dependencies and recipe ingredients are the same problem once the edges exist — and getting the edge direction backwards is the single most common mistake.',
]
notes = [
  'Seed the queue with every zero-indegree vertex, not just one. Missing that produces a valid-looking but incomplete order.',
  'The cycle test is `output.length != n`. It costs nothing and is usually the actual question being asked.',
  'A vertex with no edges still belongs in the output — build the indegree table over all vertices, not only those appearing in an edge.',
  'DFS-based topological sort needs three colours (unvisited / in progress / done). A plain visited set cannot tell a cycle from a diamond.',
  'The order is usually not unique. If the problem wants the lexicographically smallest one, swap the queue for a priority queue.',
]

[topic.syntax]
go = '''
indeg := make([]int, n)
adj := make([][]int, n)
for _, e := range edges {          // e = [from, to]: from must come first
    adj[e[0]] = append(adj[e[0]], e[1])
    indeg[e[1]]++
}

queue := []int{}
for v := 0; v < n; v++ {
    if indeg[v] == 0 { queue = append(queue, v) }
}
order := []int{}
for len(queue) > 0 {
    v := queue[0]
    queue = queue[1:]
    order = append(order, v)
    for _, w := range adj[v] {
        indeg[w]--
        if indeg[w] == 0 { queue = append(queue, w) }
    }
}
if len(order) != n { /* a cycle: no valid order */ }
'''
cpp = '''
vector<int> indeg(n, 0);
vector<vector<int>> adj(n);
for (auto& e : edges) { adj[e[0]].push_back(e[1]); indeg[e[1]]++; }

queue<int> q;
for (int v = 0; v < n; v++) if (!indeg[v]) q.push(v);
vector<int> order;
while (!q.empty()) {
    int v = q.front(); q.pop();
    order.push_back(v);
    for (int w : adj[v]) if (--indeg[w] == 0) q.push(w);
}
bool hasCycle = (int)order.size() != n;
'''
java = '''
int[] indeg = new int[n];
List<List<Integer>> adj = new ArrayList<>();
for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
for (int[] e : edges) { adj.get(e[0]).add(e[1]); indeg[e[1]]++; }

Deque<Integer> q = new ArrayDeque<>();
for (int v = 0; v < n; v++) if (indeg[v] == 0) q.add(v);
List<Integer> order = new ArrayList<>();
while (!q.isEmpty()) {
    int v = q.poll();
    order.add(v);
    for (int w : adj.get(v)) if (--indeg[w] == 0) q.add(w);
}
boolean hasCycle = order.size() != n;
'''


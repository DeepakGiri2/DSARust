[[topic]]
id = 'math'
title = 'Number Theory & Overflow'
kind = 'technique'
emoji = '🧮'
what = [
  'Most "math" interview problems are really about avoiding the obvious computation. Trailing zeroes of n! is a count of the factors of five, not a factorial. Checking primality needs divisors only up to √n, because a composite always has one there. Counting all primes below n is the Sieve of Eratosthenes, marking multiples instead of testing each candidate. In every case the naive version is not slow — it is impossible, because the intermediate value does not fit.',
  'The tools that keep coming up are small: gcd by the Euclidean algorithm (and lcm = a / gcd(a, b) × b, dividing first so the product does not overflow), fast exponentiation by squaring for x^n and for modular powers, and modular arithmetic where every intermediate step is reduced so nothing grows.',
  "Overflow is the silent failure mode. A 32-bit int holds about 2.1 × 10⁹, which two multiplied five-digit numbers already exceed; a 64-bit integer holds about 9.2 × 10¹⁸. Go's int is 64-bit on any modern platform, C++ and Java default to 32-bit int and need an explicit long. The classic bug is `(lo + hi) / 2` in a binary search over large values — `lo + (hi - lo) / 2` never overflows.",
]
notes = [
  'Integer division truncates toward zero in Go, C++ and Java, so -7 / 2 is -3, not -4. Python floors instead — do not carry that intuition across.',
  'The remainder of a negative number is negative in all three languages. Normalise with ((x % m) + m) % m before using it as an index or key.',
  'Ceiling division of non-negative integers is (a + b - 1) / b — no floating point, so no rounding surprises.',
  'Cast before multiplying, not after: in Java `(long) a * b` is right and `(long)(a * b)` has already overflowed.',
  'Never compare floating-point values with ==. Compare against an epsilon, or restructure to use integers.',
  'x % 2 == 1 is false for negative odd numbers in C++ and Java. Use x % 2 != 0.',
]

[topic.syntax]
go = '''
func gcd(a, b int) int {
    for b != 0 { a, b = b, a%b }
    return a
}
lcm := a / gcd(a, b) * b          // divide first: avoids overflow

func power(x, n, mod int) int {   // exponentiation by squaring
    result := 1
    for n > 0 {
        if n&1 == 1 { result = result * x % mod }
        x = x * x % mod
        n >>= 1
    }
    return result
}

mid := lo + (hi-lo)/2             // never overflows
ceil := (a + b - 1) / b
'''
cpp = '''
int g = __gcd(a, b);              // <algorithm>; or std::gcd in C++17
long long l = 1LL * a / g * b;

long long power(long long x, long long n, long long mod) {
    long long result = 1;
    while (n > 0) {
        if (n & 1) result = result * x % mod;
        x = x * x % mod;
        n >>= 1;
    }
    return result;
}

int mid = lo + (hi - lo) / 2;
long long product = 1LL * a * b;  // cast BEFORE multiplying
'''
java = '''
static int gcd(int a, int b) {
    while (b != 0) { int t = b; b = a % b; a = t; }
    return a;
}
long lcm = (long) a / gcd(a, b) * b;

static long power(long x, long n, long mod) {
    long result = 1;
    while (n > 0) {
        if ((n & 1) == 1) result = result * x % mod;
        x = x * x % mod;
        n >>= 1;
    }
    return result;
}

int mid = lo + (hi - lo) / 2;
long product = (long) a * b;      // cast BEFORE multiplying
'''


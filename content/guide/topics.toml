[[topic]]
id = 'hashset'
title = 'Hash Set'
kind = 'structure'
emoji = '🎯'
what = [
  'A set stores unique values with O(1) average add / remove / contains — it is a hash map where you only care about the keys. Adding a duplicate is a no-op, which is itself useful: "have I seen this before?" becomes one line.',
  'Typical DSA jobs: detecting duplicates (Contains Duplicate), tracking visited nodes in graph/grid traversal so you never loop forever, and O(1) membership tests that turn nested scans into linear passes (Longest Consecutive Sequence checks `n-1 in set` to find sequence starts).',
  'Go has no built-in set type — the idiom is map[T]bool or the zero-byte map[T]struct{}. That is not a workaround, it is the intended design.',
]
notes = [
  'Same key restrictions as hash maps (see Hash Map notes).',
  'For visited-tracking on grids, encoding (row, col) as row*cols+col into an int set — or just a 2-D boolean array — avoids needing a pair/tuple key.',
  'Java add() returning boolean ("was it new?") lets you detect duplicates while inserting: if (!seen.add(x)) return true;',
]


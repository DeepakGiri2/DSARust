  'A 2-D grid is secretly a graph: each cell (r, c) is a node, connected to its 4 orthogonal neighbors (up, down, left, right). Number of Islands, Rotting Oranges, Word Search — all are BFS/DFS wearing a grid costume. Rows are indexed 0 … rows-1 top-to-bottom and columns 0 … cols-1 left-to-right, and grid[r][c] means row first, column second (r is the "y", c is the "x" — the reverse of screen coordinates; this trips everyone once).',
  'The directions array is the idiom that keeps neighbor code sane: dirs = [(-1,0),(1,0),(0,-1),(0,1)], loop over it, and bounds-check every candidate BEFORE indexing: 0 ≤ nr < rows AND 0 ≤ nc < cols. Diagonals just extend the array to 8 entries.',
  "Visited-tracking can be a separate boolean grid, or in-place mutation (sink the island: flip '1' to '0' as you visit) which uses no extra memory. Multi-source BFS (Rotting Oranges) starts with ALL sources in the queue at level 0 — the level count where the queue empties is the answer.",
]
notes = [
  'grid[r][c]: ROW index first (vertical), column second. r ∈ [0, rows-1], c ∈ [0, cols-1], both 0-based.',
  'Bounds-check BEFORE indexing — the check-inside-the-recursive-call pattern (shown above) keeps it in exactly one place.',
  'Encoding a cell as one int: id = r*cols + c (decode: r = id/cols, c = id%cols) — handy for visited sets.',
  'Assumes a rectangular grid; grab cols from grid[0] once, not per row.',
]

[topic.syntax]
go = '''
rows, cols := len(grid), len(grid[0])
dirs := [4][2]int{{-1,0},{1,0},{0,-1},{0,1}}

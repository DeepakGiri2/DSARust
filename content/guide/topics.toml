[[topic]]
id = 'binarysearch'
title = 'Binary Search'
kind = 'technique'
emoji = '🎯'
what = [
  'Binary search finds a target in sorted data by halving the search space each probe: check the middle, discard the half that cannot contain the answer, repeat. n → n/2 → n/4 → … reaches 1 in log₂(n) steps — a billion elements in ~30 probes.',
  "The bulletproof template: lo, hi = 0, n-1; while lo <= hi: mid = lo + (hi-lo)/2; three-way compare, moving lo = mid+1 or hi = mid-1 (always PAST mid — mid itself was checked; leaving it in causes infinite loops). The generalization that unlocks harder problems: you don't need a sorted array, only a MONOTONIC predicate — anything false…false,true…true can be searched for its boundary. \"Search on the answer\": Koko Eating Bananas binary-searches candidate speeds, checking feasibility in O(n) per probe.",
  'Rotated arrays (Search in Rotated Sorted Array): at every mid, at least one half is still properly sorted — check which via arr[lo] ≤ arr[mid], then test whether the target lies inside that sorted half to decide direction.',
]
notes = [
  'mid = lo + (hi - lo) / 2, not (lo + hi) / 2 — the sum can overflow 32-bit ints in C++/Java.',
  'Pick ONE convention (inclusive hi + lo <= hi shown here) and never mix it with the half-open variant mid-loop.',
  'lo/hi must always move PAST mid. If a variant keeps hi = mid (half-open style), the loop condition must be lo < hi.',
  "For first/last occurrence, don't return on equality — record the hit and keep narrowing toward the wanted side.",
]

[topic.syntax]
go = '''
lo, hi := 0, len(nums)-1
for lo <= hi {
    mid := lo + (hi-lo)/2          // no overflow
    if nums[mid] == target { return mid }
    if nums[mid] < target { lo = mid + 1 } else { hi = mid - 1 }
}
return -1
// stdlib: sort.SearchInts(nums, target) — first index where >= target
'''
cpp = '''
int lo = 0, hi = nums.size() - 1;
while (lo <= hi) {
    int mid = lo + (hi - lo) / 2;
    if (nums[mid] == target) return mid;
    if (nums[mid] < target) lo = mid + 1; else hi = mid - 1;
}
return -1;
// stdlib: lower_bound(v.begin(), v.end(), x) — first iterator where >= x
'''
java = '''
int lo = 0, hi = nums.length - 1;
while (lo <= hi) {
    int mid = lo + (hi - lo) / 2;
    if (nums[mid] == target) return mid;
    if (nums[mid] < target) lo = mid + 1; else hi = mid - 1;
}
return -1;
// stdlib: Arrays.binarySearch(nums, target)
'''


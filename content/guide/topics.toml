[[topic]]
id = 'memo'
title = 'Recursion & Memoization'
kind = 'technique'
emoji = '🌀'
what = [
  'Every recursive solution has three parts, and naming them in order is most of the work: the state (what arguments fully describe a subproblem), the base case (the smallest state, answered without recursing), and the transition (how a state is built from smaller ones). If two different call paths can reach the same state, the recursion is re-computing work, and a cache fixes it — that is all memoization is.',
  'Top-down memoization and bottom-up tabulation compute the same values in different orders. Top-down is easier to derive, because you write the recurrence exactly as you reasoned about it and only visit the states you actually need. Bottom-up avoids the call stack and makes space optimisation obvious — when a row only depends on the row before it, the table collapses to two rows, then often to one.',
  'Recursion depth is a real constraint, not a formality. Java and C++ overflow the stack at roughly 10⁴–10⁵ frames; Go grows its stacks dynamically and survives far more. A recursion over 10⁵ elements is fine in Go and a crash in Java, and that difference alone sometimes decides which form to write.',
]
notes = [
  'The cache key must be the *whole* state. Forgetting one parameter produces answers that are right on small inputs and wrong on large ones — the hardest kind of bug to spot.',
  'Distinguish "not computed yet" from a legitimate 0 or -1 result. Use a sentinel that cannot occur naturally (Integer.MIN_VALUE, or a separate seen array).',
  'Count the states before writing anything: states × work-per-state is the complexity. If it does not fit the constraints, the state is wrong — no amount of coding will save it.',
  'A recursive helper in Go or C++ that captures itself must be declared before it is assigned (`var dfs func(int) int` / `function<int(int)> dfs`).',
  'Passing arrays by value into a recursive helper copies them on every call. Pass a reference or index instead, or the complexity is quietly multiplied by n.',
]

[topic.syntax]
go = '''
memo := map[[2]int]int{}
var dfs func(i, j int) int          // declare first: it refers to itself
dfs = func(i, j int) int {
    if i == n || j == m { return 0 }          // base case
    key := [2]int{i, j}
    if v, ok := memo[key]; ok { return v }    // cached
    best := dfs(i+1, j)                       // transition
    if a[i] == b[j] { best = max(best, 1+dfs(i+1, j+1)) }
    memo[key] = best
    return best
}
'''
cpp = '''
vector<vector<int>> memo(n + 1, vector<int>(m + 1, -1));
function<int(int,int)> dfs = [&](int i, int j) {
    if (i == n || j == m) return 0;
    int& cached = memo[i][j];
    if (cached != -1) return cached;
    int best = dfs(i + 1, j);
    if (a[i] == b[j]) best = max(best, 1 + dfs(i + 1, j + 1));
    return cached = best;
};
'''
java = '''
Integer[][] memo = new Integer[n + 1][m + 1];   // null = not computed

int dfs(int i, int j) {
    if (i == n || j == m) return 0;
    if (memo[i][j] != null) return memo[i][j];
    int best = dfs(i + 1, j);
    if (a[i] == b[j]) best = Math.max(best, 1 + dfs(i + 1, j + 1));
    return memo[i][j] = best;
}
'''


[[topic]]
id = 'interview'
title = 'Running the 45 Minutes'
kind = 'technique'
emoji = '🎯'
what = [
  'The algorithm is only part of what is being scored. A working solution delivered in silence rates below a slightly worse one that was explained, tested and corrected out loud, because the interviewer is trying to predict what you are like to work with. Say what you are considering before you commit to it, and say why you rejected the alternative.',
  'A reliable shape for the time: restate the problem in your own words and confirm it (1 minute); ask about the constraints and the edge cases — empty input, duplicates, negatives, overflow (2 minutes); state a brute-force solution and its complexity, so there is always something on the table (2 minutes); name the bottleneck and the structure that removes it, and get agreement before coding (5 minutes); write it while narrating the invariant of each loop (15 minutes); then walk a small example through the finished code line by line, out loud, and fix what you find (5 minutes).',
  'That last step is the one candidates skip and interviewers weigh most. Tracing your own code and finding your own off-by-one is the strongest signal you can send; being told about it by the interviewer is the weakest. Leave time for it deliberately — a solution that is 90% written and traced beats one that is 100% written and unexamined.',
]
notes = [
  'Ask before assuming: can the input be empty, can values be negative, are there duplicates, is it sorted, how large can it get, may the input be modified?',
  'Never stay silent for more than about twenty seconds. "I am thinking about whether a hash map removes the inner loop" is a contribution; a blank pause is not.',
  'If you are stuck, say what you have and what is blocking it. Interviewers are usually allowed to give hints and almost always want to.',
  'Write the brute force down if nothing better comes. An O(n²) solution that works scores far better than an O(n) solution that does not exist.',
  'Name variables for what they mean — left, right, remaining, seen. Single letters are fine for indices and nothing else.',
  'When you finish, say the time and space complexity unprompted, and mention the one case you would test first.',
  'Hidden constraints are real questions: "the array is sorted" means binary search or two pointers, "values are 0…25" means a 26-slot array, "return any valid answer" means a greedy solution may be enough.',
]

[topic.syntax]
go = '''
// A shape worth having in muscle memory before the clock starts.
func solve(nums []int, target int) int {
    if len(nums) == 0 {          // 1. edge cases first, out loud
        return -1
    }
    seen := map[int]int{}        // 2. the structure that removes the inner loop
    for i, x := range nums {     // 3. invariant: seen holds every value before i
        if j, ok := seen[target-x]; ok {
            return j             // 4. the exit, and why it is correct
        }
        seen[x] = i
    }
    return -1                    // 5. the "nothing found" case, never forgotten
}
// O(n) time, O(n) space — say this before being asked.
'''
cpp = '''
int solve(vector<int>& nums, int target) {
    if (nums.empty()) return -1;
    unordered_map<int, int> seen;
    for (int i = 0; i < (int)nums.size(); i++) {
        auto it = seen.find(target - nums[i]);
        if (it != seen.end()) return it->second;
        seen[nums[i]] = i;
    }
    return -1;
}
// Trace it: nums = {3, 3}, target = 6. Does it return 0? Say the answer aloud.
'''
java = '''
static int solve(int[] nums, int target) {
    if (nums.length == 0) return -1;
    Map<Integer, Integer> seen = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        Integer j = seen.get(target - nums[i]);
        if (j != null) return j;
        seen.put(nums[i], i);
    }
    return -1;
}
// Then: "O(n) time, O(n) space. The case I would test first is duplicates."
'''


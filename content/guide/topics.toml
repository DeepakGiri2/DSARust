[[topic]]
id = 'monotonic'
title = 'Monotonic Stack & Deque'
kind = 'technique'
emoji = '📉'
what = [
  'A monotonic stack keeps its contents sorted — increasing or decreasing — by popping everything that would break the order before pushing. That sounds like a constraint; it is really a filter. The elements popped are exactly the ones for which the new element is the answer, so "next greater element", "days until a warmer temperature" and "largest rectangle in a histogram" all fall out of the pop, not the push.',
  'The cost argument is the same every time: each element is pushed once and popped once, so the total work is O(n) even though a single step may pop many elements. Seeing the inner loop and calling it O(n²) is the mistake this technique exists to punish.',
  'A monotonic deque is the sliding-window version: values are dropped from the back when they can never win again, and from the front when they fall out of the window. That gives the maximum or minimum of every window in O(n) total — which is what Sliding Window Maximum is really asking for.',
]
notes = [
  'Decide first whether the stack holds values or indices. Indices are almost always right: they give widths and distances, and the value is one lookup away.',
  'An increasing stack (pop while top > new) finds the next smaller element; a decreasing stack (pop while top < new) finds the next greater. Getting the direction backwards is the classic bug.',
  'Anything still on the stack at the end has no answer to its right. Handle it explicitly, or push a sentinel (0 for histograms, ∞ for minima) to force a final flush.',
  'For the deque version, store indices so the front can be tested against the window: `if front <= i - k { popFront() }`.',
  'Strict versus non-strict comparison decides how duplicates behave. Pick one deliberately and check it on a duplicate-heavy example.',
]

[topic.syntax]
go = '''
// next greater element to the right, -1 if none
res := make([]int, len(nums))
for i := range res { res[i] = -1 }
stack := []int{}                        // indices, values decreasing
for i, x := range nums {
    for len(stack) > 0 && nums[stack[len(stack)-1]] < x {
        top := stack[len(stack)-1]
        stack = stack[:len(stack)-1]
        res[top] = x                    // x is top's answer
    }
    stack = append(stack, i)
}

// sliding window maximum, deque of indices
dq := []int{}
for i, x := range nums {
    for len(dq) > 0 && nums[dq[len(dq)-1]] <= x { dq = dq[:len(dq)-1] }
    dq = append(dq, i)
    if dq[0] <= i-k { dq = dq[1:] }     // fell out of the window
    if i >= k-1 { out = append(out, nums[dq[0]]) }
}
'''
cpp = '''
vector<int> res(nums.size(), -1);
stack<int> st;                          // indices
for (int i = 0; i < (int)nums.size(); i++) {
    while (!st.empty() && nums[st.top()] < nums[i]) {
        res[st.top()] = nums[i];
        st.pop();
    }
    st.push(i);
}

deque<int> dq;
for (int i = 0; i < (int)nums.size(); i++) {
    while (!dq.empty() && nums[dq.back()] <= nums[i]) dq.pop_back();
    dq.push_back(i);
    if (dq.front() <= i - k) dq.pop_front();
    if (i >= k - 1) out.push_back(nums[dq.front()]);
}
'''
java = '''
int[] res = new int[nums.length];
Arrays.fill(res, -1);
Deque<Integer> st = new ArrayDeque<>();
for (int i = 0; i < nums.length; i++) {
    while (!st.isEmpty() && nums[st.peek()] < nums[i]) {
        res[st.pop()] = nums[i];
    }
    st.push(i);
}

Deque<Integer> dq = new ArrayDeque<>();
for (int i = 0; i < nums.length; i++) {
    while (!dq.isEmpty() && nums[dq.peekLast()] <= nums[i]) dq.pollLast();
    dq.addLast(i);
    if (dq.peekFirst() <= i - k) dq.pollFirst();
    if (i >= k - 1) out.add(nums[dq.peekFirst()]);
}
'''


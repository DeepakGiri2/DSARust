[[topic]]
id = 'string'
title = 'String'
kind = 'structure'
emoji = '🔤'
what = [
  'A string is an array of characters, and in all three languages it is (effectively) immutable in-place editing terms: Go strings and Java Strings are truly immutable — every "modification" builds a new string. C++ std::string is mutable, which is why C++ solutions often edit in place.',
  'Because concatenation copies the whole string, building a string with s += ch in a loop is O(n²) in Go and Java. The fix is a builder: strings.Builder (Go) or StringBuilder (Java), which behave like a dynamic char array and give O(1) amortized appends, with one final O(n) conversion.',
  "Indexing s[i] returns a byte (Go) / char (C++, Java) in O(1). For classic DSA problems input is usually ASCII, so byte == character; the frequency-count trick `count[c - 'a']` maps letters a–z onto indices 0–25 of a 26-slot array.",
]
notes = [
  '0-based indexing everywhere; s.charAt(n) / s[n] on a length-n string is out of bounds.',
  'Substring argument conventions differ! Java substring(start, end) is half-open; C++ substr(start, LENGTH) takes a length; Go s[lo:hi] is half-open.',
  "Char arithmetic: 'a'–'z' are consecutive codes (97–122), '0'–'9' are 48–57. c - 'a' gives 0-based letter index; c - '0' gives the digit value.",
  'Go strings are UTF-8 bytes: len("é") is 2. For interview problems assume ASCII; if you need real characters, iterate `for _, r := range s` (runes).',
  'Comparing with == compares content in Go and C++, but object identity in Java — always use s.equals(t) in Java.',
]

[topic.syntax]
go = '''
s := "hello"
n := len(s)                    // bytes
c := s[1]                      // byte 'e' (uint8)
sub := s[1:3]                  // "el" — O(1) view, half-open
idx := int(c - 'a')            // letter → 0..25
var b strings.Builder          // fast building
b.WriteByte('x'); b.WriteString("yz")
out := b.String()
chars := []byte(s)             // mutable copy; string(chars) back
'''
cpp = '''
string s = "hello";
int n = s.size();
char c = s[1];                 // 'e'
string sub = s.substr(1, 2);   // "el" — (start, LENGTH not end!)
int idx = c - 'a';             // letter → 0..25
s += 'x';                      // std::string IS mutable, O(1) amortized
s[0] = 'H';                    // in-place edit ok
reverse(s.begin(), s.end());
'''
java = '''
String s = "hello";
int n = s.length();
char c = s.charAt(1);          // 'e'
String sub = s.substring(1, 3); // "el" — half-open (start, end)
int idx = c - 'a';             // letter → 0..25
StringBuilder sb = new StringBuilder(); // fast building
sb.append('x').append("yz");
String out = sb.toString();
char[] chars = s.toCharArray(); // mutable copy; new String(chars) back
'''


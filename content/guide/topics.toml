[[topic]]
id = 'design'
title = 'Design Problems'
kind = 'technique'
emoji = '🧩'
what = [
  "A design question hands you an interface and a time bound and asks you to pick the structures. The bound is the instruction: \"O(1) get and put\" means a hash map plus something that maintains order, because a hash map alone has no order and a list alone has no lookup. Almost every cache, iterator or counter problem is a *composition* of two structures where each covers the other's weakness.",
  'The recurring pairings are worth memorising. Hash map + doubly linked list gives LRU: the map finds a node in O(1), the list moves it to the front in O(1) because the node carries its own neighbours. Hash map + array gives insert/delete/getRandom in O(1), with deletion done by swapping the victim with the last element. Two heaps give a running median. A queue gives any "events in the last N seconds" counter. A stack of iterators gives a paused traversal.',
  'The other half of the job is keeping the pieces consistent. Every operation must update every structure, and a key left behind in one map is the classic bug — it does not crash, it just returns stale data much later. When an interviewer asks you to walk through an eviction, they are checking exactly that.',
]
notes = [
  'Ask about capacity zero, duplicate keys, and operations on an empty structure before coding. They are where design problems hide their edge cases.',
  'A doubly linked list is needed for O(1) removal, not a singly linked one: removing a node requires its predecessor, and only a doubly linked node knows it.',
  "Java's LinkedHashMap with accessOrder = true is an LRU cache in three lines — say that you know, then implement it by hand, because that is what is being asked.",
  'For "last N seconds" counters, a queue is O(1) amortised but unbounded in memory. The follow-up answer is bucketing into N slots of (timestamp, count).',
  "Deleting from a hash-map-plus-array in O(1) means swapping the victim with the last element — and remembering to update the moved element's stored index.",
]

[topic.syntax]
go = '''
// LRU: map to node, list keeps recency (container/list)
type LRU struct {
    cap   int
    items map[int]*list.Element
    order *list.List            // front = most recently used
}

func (c *LRU) Get(key int) int {
    e, ok := c.items[key]
    if !ok { return -1 }
    c.order.MoveToFront(e)      // O(1): the node knows its neighbours
    return e.Value.(*entry).value
}

// O(1) insert / delete / getRandom
type RandomSet struct {
    idx  map[int]int            // value -> position
    vals []int
}
// delete: move the last value into the hole, then shrink
'''
cpp = '''
class LRUCache {
    int cap;
    list<pair<int,int>> order;                       // front = newest
    unordered_map<int, list<pair<int,int>>::iterator> items;
public:
    int get(int key) {
        auto it = items.find(key);
        if (it == items.end()) return -1;
        order.splice(order.begin(), order, it->second);   // O(1) move
        return it->second->second;
    }
};
'''
java = '''
// By hand: HashMap + doubly linked list.
class Node { int key, val; Node prev, next; }
Map<Integer, Node> items = new HashMap<>();

// Or, when the interviewer allows the library:
Map<Integer, Integer> lru = new LinkedHashMap<>(cap, 0.75f, true) {
    protected boolean removeEldestEntry(Map.Entry<Integer,Integer> e) {
        return size() > cap;
    }
};
'''


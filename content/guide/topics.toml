[[topic]]
id = 'backtracking'
title = 'Backtracking & Recursion'
kind = 'technique'
emoji = '🔙'
what = [
  'Backtracking explores a decision tree with DFS: at each level make a choice, recurse deeper, then UNDO the choice and try the next option. The undo is the defining move — it returns the shared state to exactly what it was, so sibling branches start clean. Subsets (include element i or not), Permutations (which unused element next), Combination Sum, N-Queens — all the same skeleton.',
  'The template: backtrack(state, choices) → if the state is complete, record a COPY of it and return; otherwise for each valid choice: apply it (append to path, mark used), recurse, revert it (pop from path, unmark). Pruning — skipping choices that provably cannot lead to a solution (sum already exceeds target; duplicate value at the same depth) — is what keeps exponential search practical.',
  'Recursion mechanics worth internalizing: every call pushes a frame (its own copy of parameters and locals) onto the call stack; base cases stop the descent. Frames are independent — but anything passed by reference/pointer (the path slice, the used array) is SHARED across all frames, which is exactly why the undo step and the record-a-copy step are both mandatory.',
]
notes = [
  'Record a COPY of the path — the path object keeps mutating after you store it; storing the reference gives you a result list full of identical (usually empty) lists. (C++ push_back copies automatically.)',
  'The `start` index prevents revisiting earlier elements → combinations. Permutations instead loop over ALL elements with a used[] array.',
  'Choose / explore / un-choose must be perfectly symmetric — every mutation before the recursive call needs its inverse after.',
  'To skip duplicates: sort first, then at each depth skip nums[i] == nums[i-1] when i > start.',
]

[topic.syntax]
go = '''
var res [][]int
var path []int
var backtrack func(start int)
backtrack = func(start int) {
    cp := make([]int, len(path))
    copy(cp, path)
    res = append(res, cp)          // record a COPY!
    for i := start; i < len(nums); i++ {
        path = append(path, nums[i])   // choose
        backtrack(i + 1)               // explore
        path = path[:len(path)-1]      // un-choose
    }
}
backtrack(0)
'''
cpp = '''
vector<vector<int>> res;
vector<int> path;
function<void(int)> backtrack = [&](int start) {
    res.push_back(path);           // vector copies on push_back
    for (int i = start; i < nums.size(); i++) {
        path.push_back(nums[i]);   // choose
        backtrack(i + 1);          // explore
        path.pop_back();           // un-choose
    }
};
backtrack(0);
'''
java = '''
List<List<Integer>> res = new ArrayList<>();
List<Integer> path = new ArrayList<>();
void backtrack(int[] nums, int start) {
    res.add(new ArrayList<>(path)); // record a COPY!
    for (int i = start; i < nums.length; i++) {
        path.add(nums[i]);          // choose
        backtrack(nums, i + 1);     // explore
        path.remove(path.size() - 1); // un-choose
    }
}
'''


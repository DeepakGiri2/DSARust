[[topic]]
id = 'hashmap'
title = 'Hash Map (dictionary)'
kind = 'structure'
emoji = '🗺️'
what = [
  'A hash map stores key → value pairs with O(1) average lookup. It runs the key through a hash function to get a bucket index in an internal array, and stores the pair there. Lookup re-hashes the key and jumps straight to the bucket — no scanning. Collisions (two keys, same bucket) are handled with per-bucket chains or probing; with a good hash function chains stay tiny, which is where the "average O(1)" comes from.',
  'Like a dynamic array, the map resizes when it gets too full (load factor), rehashing every key into a bigger table — an occasional O(n) hit amortized away over many inserts.',
  'The classic use in DSA: trade memory for time. Two Sum drops from O(n²) to O(n) by asking "have I already seen target - x?" in O(1). Frequency counting, grouping anagrams by a signature key, caching/memoization — all hash-map patterns. Iteration order is NOT the insertion order (Go even randomizes it deliberately); never rely on it.',
]
notes = [
  'Missing-key behavior differs sharply: Go returns the zero value silently, C++ operator[] INSERTS a default entry, Java get() returns null. Use comma-ok / find() / getOrDefault() respectively.',
  'Keys must be hashable: Go — comparable types only (no slices/maps as keys; use arrays like [26]int); C++ unordered_map needs std::hash (no std::hash for vector/pair without custom hash — encode as string or use map); Java keys need consistent hashCode()/equals().',
  'Go maps are unordered by design (iteration order randomized). Need sorted keys? Collect keys into a slice and sort. C++ std::map / Java TreeMap keep keys sorted but cost O(log n) per op.',
  'A hash map of counts over a small alphabet (a–z) is usually better as a plain int[26] array — faster and comparable by value.',
]

[topic.syntax]
go = '''
m := map[string]int{}          // or make(map[string]int)
m["a"] = 1                     // insert / overwrite
v := m["b"]                    // MISSING KEY → zero value (0), no error!
v, ok := m["b"]                // comma-ok: ok=false if absent
if _, ok := m["a"]; ok { }     // contains?
delete(m, "a")
m["x"]++                       // counting works even if absent (0+1)
for k, v := range m { _ = k; _ = v }
'''
cpp = '''
unordered_map<string, int> m;
m["a"] = 1;                    // insert / overwrite
int v = m["b"];                // MISSING KEY → inserts default 0!
if (m.count("a")) { }          // contains? (0 or 1)
auto it = m.find("a");         // iterator, m.end() if absent
m.erase("a");
m["x"]++;                      // counting idiom
for (auto& [k, v] : m) { }     // structured binding (C++17)
'''
java = '''
Map<String, Integer> m = new HashMap<>();
m.put("a", 1);                 // insert / overwrite
Integer v = m.get("b");        // MISSING KEY → null (NPE if unboxed!)
int w = m.getOrDefault("b", 0);
if (m.containsKey("a")) { }
m.remove("a");
m.merge("x", 1, Integer::sum); // counting idiom
for (Map.Entry<String, Integer> e : m.entrySet()) { }
'''


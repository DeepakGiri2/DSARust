[[topic]]
id = 'linkedlist'
title = 'Linked List'
kind = 'structure'
emoji = '🔗'
what = [
  'A linked list is a chain of nodes, each holding a value and a pointer to the next node. Unlike an array, nodes live anywhere in memory — the structure IS the pointers. That inverts the array trade-off: O(1) insertion/deletion once you are standing at the spot (just rewire two pointers), but O(n) to reach position i because you must walk from the head.',
  "Nearly every list problem is pointer surgery. Reversal: walk with prev/cur, flipping cur.next to point backwards. The two-pointer family: slow/fast (fast moves 2×) finds the middle, and if the list has a cycle, fast laps slow — they meet (Floyd's cycle detection). Deleting the n-th node from the end: advance one pointer n steps, then move both until the lead hits the end.",
  'The dummy (sentinel) node is the great edge-case killer: dummy.next = head, do all surgery from dummy, return dummy.next. It removes every "what if I delete the head?" special case. Draw boxes and arrows on paper — order of rewiring matters, and saving next before overwriting it is the #1 bug.',
]
notes = [
  'Null names differ: nil (Go), nullptr (C++), null (Java). Dereferencing it panics/segfaults/throws — check before every .next hop.',
  'Save the next pointer BEFORE rewiring: next := cur.Next must happen before cur.Next = prev, or the rest of the list is lost.',
  'Fast-pointer loop guard must check both: for fast != nil && fast.Next != nil — checking only one is the classic nil-pointer crash.',
  'C++ uses -> on pointers (cur->next); Go and Java use . for everything.',
]

[topic.syntax]
go = '''
type ListNode struct {
    Val  int
    Next *ListNode
}
dummy := &ListNode{Next: head} // sentinel
prev, cur := dummy, head
for cur != nil {
    // delete cur:  prev.Next = cur.Next
    prev, cur = cur, cur.Next
}
// reversal core:
// next := cur.Next; cur.Next = prev; prev = cur; cur = next
'''
cpp = '''
struct ListNode {
    int val;
    ListNode *next;
    ListNode(int x) : val(x), next(nullptr) {}
};
ListNode dummy(0); dummy.next = head; // sentinel on the stack
ListNode *prev = &dummy, *cur = head;
while (cur != nullptr) {
    // delete cur:  prev->next = cur->next;
    prev = cur; cur = cur->next;
}
'''
java = '''
class ListNode {
    int val;
    ListNode next;
    ListNode(int x) { val = x; }
}
ListNode dummy = new ListNode(0); dummy.next = head;
ListNode prev = dummy, cur = head;
while (cur != null) {
    // delete cur:  prev.next = cur.next;
    prev = cur; cur = cur.next;
}
'''


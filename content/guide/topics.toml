vector<int> diff(n + 1, 0);
diff[l] += v; diff[r + 1] -= v;
int run = 0;
for (int i = 0; i < n; i++) { run += diff[i]; out[i] = run; }

unordered_map<long long, int> seen{{0, 1}};
long long s = 0; int count = 0;
for (int x : nums) { s += x; count += seen[s - k]; seen[s]++; }
'''

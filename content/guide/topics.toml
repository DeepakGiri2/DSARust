[[topic]]
id = 'sorting'
title = 'Sorting & Selection'
kind = 'technique'
emoji = '🔤'
what = [
  'You will rarely implement a sort in an interview, but you will constantly choose one and reason about it. The library sort is O(n log n) and comparison-based: Go uses pattern-defeating quicksort, C++ introsort (quicksort falling back to heapsort), Java dual-pivot quicksort for primitives and Timsort for objects. That last split is why sorting a Java int[] is not stable while sorting an Integer[] is.',
  'Sorting is more often the setup move than the answer. It is what makes two-pointer scans, greedy sweeps and interval merges possible, at a cost of O(n log n) up front. Recognising "sort, then one linear pass" as a shape is worth more than any implementation detail.',
  'When only the k-th element is wanted, sorting is overkill. Quickselect partitions around a pivot and recurses into one side only, averaging O(n); a size-k heap costs O(n log k) and streams. And when the values are small integers, counting or bucket sort sidesteps the comparison lower bound entirely at O(n + range) — which is how "top k frequent elements" reaches O(n).',
]
notes = [
  'Stability means equal elements keep their input order. It matters whenever you sort by one key having already sorted by another.',
  'Comparators must be consistent: a < b, b < a and equality have to agree. An inconsistent one can crash Java at runtime ("Comparison method violates its general contract") rather than merely sorting oddly.',
  'Never write `(a, b) -> a.value - b.value` for values that may be large or negative — the subtraction overflows. Use Integer.compare.',
  'Sorting pairs by their second element is the interval-greedy setup; by their first, the merge setup. Which one you need is often the whole problem.',
  'Quickselect is O(n) average but O(n²) worst case; randomising the pivot makes that vanishingly unlikely.',
  'Counting sort needs a bounded value range, and its memory is proportional to that range, not to n.',
]

[topic.syntax]
go = '''
sort.Ints(nums)
sort.Slice(items, func(i, j int) bool {   // by end, then start
    if items[i].end != items[j].end { return items[i].end < items[j].end }
    return items[i].start < items[j].start
})
sort.SliceStable(items, less)             // when stability matters

// counting sort over a small range
count := make([]int, maxVal+1)
for _, x := range nums { count[x]++ }
out = out[:0]
for v, c := range count {
    for ; c > 0; c-- { out = append(out, v) }
}
'''
cpp = '''
sort(nums.begin(), nums.end());
sort(v.begin(), v.end(), [](auto& a, auto& b) {
    return a.end != b.end ? a.end < b.end : a.start < b.start;
});
stable_sort(v.begin(), v.end(), cmp);

nth_element(v.begin(), v.begin() + k, v.end());  // quickselect, O(n) avg
partial_sort(v.begin(), v.begin() + k, v.end()); // k smallest, in order
'''
java = '''
Arrays.sort(nums);                        // primitives: dual-pivot quicksort
Arrays.sort(boxed, Comparator             // objects: Timsort, stable
    .comparingInt((Item a) -> a.end)
    .thenComparingInt(a -> a.start));
list.sort(Comparator.comparingInt(Item::getEnd));

// NEVER (a, b) -> a.end - b.end   — overflows
Arrays.sort(pairs, (a, b) -> Integer.compare(a[1], b[1]));
'''


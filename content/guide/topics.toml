[[topic]]
id = 'twopointers'
title = 'Two Pointers'
kind = 'technique'
emoji = '👉'
what = [
  'Two pointers replaces a nested O(n²) scan with one O(n) pass by maintaining two indices with an invariant that lets you move one of them decisively at every step. Each pointer only ever moves forward (or the two only ever move toward each other), so total movement is bounded by n.',
  'Converging pattern (sorted data): l = 0, r = n-1. Compare arr[l] + arr[r] to the target: too small → l++ (the only way to grow the sum), too big → r-- (the only way to shrink it). That decisiveness is WHY sorting is a precondition — it is what makes one move provably safe. Two Sum II, 3Sum (fix one element, converge on the rest), Container With Most Water (move the shorter wall — the taller one can never do better with a narrower gap).',
  'Fast/slow pattern (same direction): the slow pointer marks the boundary of "kept" elements while fast scans everything — in-place dedup and Remove Element work this way. On linked lists, fast moving 2× finds the middle and detects cycles (Floyd).',
]
notes = [
  'Loop condition l < r (not <=) when the two pointers must be distinct elements.',
  "For each move, be able to say why the skipped pairs cannot be the answer — that argument IS the algorithm's correctness.",
  'In 3Sum-style problems, skip duplicate values after each move to avoid duplicate triples.',
]

[topic.syntax]
go = '''
l, r := 0, len(nums)-1
for l < r {
    sum := nums[l] + nums[r]
    if sum == target { break }     // found
    if sum < target { l++ } else { r-- }
}
// fast/slow (dedup): slow := 0; for fast := range nums {...}
'''
cpp = '''
int l = 0, r = nums.size() - 1;
while (l < r) {
    int sum = nums[l] + nums[r];
    if (sum == target) break;
    if (sum < target) l++; else r--;
}
'''
java = '''
int l = 0, r = nums.length - 1;
while (l < r) {
    int sum = nums[l] + nums[r];
    if (sum == target) break;
    if (sum < target) l++; else r--;
}
'''


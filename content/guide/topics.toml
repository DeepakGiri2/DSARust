[[topic]]
id = 'shortestpath'
title = 'Shortest Paths'
kind = 'technique'
emoji = '🧭'
what = [
  'Which algorithm to reach for is decided entirely by the edge weights. Unweighted, or all weights equal: plain BFS, because the first time BFS reaches a vertex it has used the fewest edges possible. Non-negative weights: Dijkstra, a BFS whose queue is a min-heap keyed by distance. Weights that may be negative: Bellman–Ford, which relaxes every edge V−1 times and can also report a negative cycle. All pairs on a small graph: Floyd–Warshall, three nested loops with the intermediate vertex outermost.',
  'Dijkstra is greedy, and its correctness rests on non-negativity: once a vertex is popped with the smallest tentative distance, no later path can improve it, because every remaining edge only adds. One negative edge destroys that argument — which is why the answer to "what if weights can be negative?" is a different algorithm, not a patch.',
  'Many problems that never mention paths are shortest-path problems in disguise. Minimum effort across a grid, cheapest flights within k stops, the path maximising a product of probabilities, the fewest transformations of a word ladder — each becomes one of these four once the state and the edge cost are named. Choosing what a "vertex" is is usually the real work: it may be a cell, a (cell, fuel left) pair, or a string.',
]
notes = [
  'Dijkstra with a heap needs a stale-entry check: after popping, if the popped distance is worse than the recorded one, skip it. Without it the same vertex is processed repeatedly.',
  'Do not use Dijkstra on negative weights "because it usually works" — it returns a wrong answer silently rather than failing.',
  '0-1 BFS (a deque, 0-weight edges to the front and 1-weight to the back) is O(V + E) and beats Dijkstra whenever every weight is 0 or 1.',
  'For "at most k stops", the state is (vertex, stops used). Plain Dijkstra over vertices alone is wrong: a costlier path with fewer stops may be the one that survives.',
  'Bellman–Ford needs exactly V−1 rounds; a V-th round that still improves something proves a negative cycle.',
  'Multiplying probabilities instead of adding costs works with a max-heap and the same relaxation. The algorithm does not care that the operator changed, only that it stays monotone.',
]

[topic.syntax]
go = '''
// Dijkstra: dist[] plus a min-heap of (distance, vertex)
dist := make([]int, n)
for i := range dist { dist[i] = math.MaxInt }
dist[src] = 0
pq := &minHeap{{0, src}}
for pq.Len() > 0 {
    cur := heap.Pop(pq).(item)
    if cur.d > dist[cur.v] { continue }     // stale entry
    for _, e := range adj[cur.v] {          // e = {to, weight}
        if nd := cur.d + e.w; nd < dist[e.to] {
            dist[e.to] = nd
            heap.Push(pq, item{nd, e.to})
        }
    }
}
'''
cpp = '''
vector<long long> dist(n, LLONG_MAX);
dist[src] = 0;
priority_queue<pair<long long,int>,
               vector<pair<long long,int>>, greater<>> pq;
pq.push({0, src});
while (!pq.empty()) {
    auto [d, v] = pq.top(); pq.pop();
    if (d > dist[v]) continue;              // stale
    for (auto& [to, w] : adj[v]) {
        if (d + w < dist[to]) {
            dist[to] = d + w;
            pq.push({dist[to], to});
        }
    }
}
'''
java = '''
long[] dist = new long[n];
Arrays.fill(dist, Long.MAX_VALUE);
dist[src] = 0;
PriorityQueue<long[]> pq =
    new PriorityQueue<>((a, b) -> Long.compare(a[0], b[0]));
pq.add(new long[]{0, src});
while (!pq.isEmpty()) {
    long[] cur = pq.poll();
    int v = (int) cur[1];
    if (cur[0] > dist[v]) continue;         // stale
    for (int[] e : adj.get(v)) {            // e = {to, weight}
        if (cur[0] + e[1] < dist[e[0]]) {
            dist[e[0]] = cur[0] + e[1];
            pq.add(new long[]{dist[e[0]], e[0]});
        }
    }
}
'''


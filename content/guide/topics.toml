[[topic]]
id = 'matching'
title = 'String Matching (KMP & Rolling Hash)'
kind = 'technique'
emoji = '🔎'
what = [
  'The naive substring search tries the pattern at every position and, on a mismatch, throws away everything it just learned — O(n·m). KMP keeps that knowledge in a table: lps[i] is the length of the longest proper prefix of the pattern that is also a suffix of pattern[0..i]. On a mismatch after j matched characters the pattern slides so that lps[j-1] characters are still matched, and the haystack pointer never moves backwards. That one property is what makes the scan O(n + m).',
  "The same table answers questions that have nothing to do with searching. The pattern's period is m − lps[m-1], so \"is this string one block repeated?\" is a single modulo away, and the shortest prefix that must be prepended to make a palindrome comes from running the table over s + separator + reverse(s).",
  'Rolling hashes (Rabin–Karp) take the other route: turn each window into a number that updates in O(1) as the window slides, and compare numbers instead of strings. Simpler to write, and it generalises to 2-D and to many patterns at once — at the cost of being probabilistic, so equal hashes must be confirmed with a real comparison.',
]
notes = [
  'lps[0] is always 0 — a proper prefix cannot be the whole string.',
  'The fallback `length = lps[length-1]` is not a bug: it can run several times for one character, and the total across the build is still O(m).',
  'The built-ins (strings.Index, string::find, String.indexOf) are what you would actually ship; the interview is asking whether you know what they do inside.',
  'For a rolling hash use a large prime modulus and a random base. Base 31 with a 2³² modulus is exactly the case anti-hash tests are built to break.',
  'Rabin–Karp must verify a hash match with a real comparison to be correct. Skipping that is a bug, not an optimisation.',
]

[topic.syntax]
go = '''
// LPS table
lps := make([]int, len(p))
for i, length := 1, 0; i < len(p); {
    if p[i] == p[length] {
        length++
        lps[i] = length
        i++
    } else if length > 0 {
        length = lps[length-1]    // fall back, do not restart
    } else {
        lps[i] = 0
        i++
    }
}

// is s one block repeated?
period := len(s) - lps[len(s)-1]
repeated := lps[len(s)-1] > 0 && len(s)%period == 0

idx := strings.Index(haystack, needle)   // -1 if absent
'''
cpp = '''
vector<int> lps(p.size(), 0);
for (int i = 1, len = 0; i < (int)p.size(); ) {
    if (p[i] == p[len])   { lps[i++] = ++len; }
    else if (len > 0)     { len = lps[len - 1]; }
    else                  { lps[i++] = 0; }
}

size_t at = haystack.find(needle);       // string::npos if absent
'''
java = '''
int[] lps = new int[p.length()];
for (int i = 1, len = 0; i < p.length(); ) {
    if (p.charAt(i) == p.charAt(len)) { lps[i++] = ++len; }
    else if (len > 0)                 { len = lps[len - 1]; }
    else                              { lps[i++] = 0; }
}

int at = haystack.indexOf(needle);       // -1 if absent
'''


[[topic]]
id = 'array'
title = 'Array / Slice / Vector'
kind = 'structure'
emoji = '🔢'
what = [
  'An array is one contiguous block of memory: element i lives exactly at base_address + i × element_size. That single multiplication is why reading or writing arr[i] is O(1) — the CPU jumps straight to the byte, no searching. Contiguity also makes iteration extremely fast in practice (cache lines pull in neighbors for free).',
  'Dynamic arrays (Go slice, C++ vector, Java ArrayList) wrap a fixed array and track length vs capacity. Appending is O(1) *amortized*: while length < capacity it just writes to the next cell; when full, it allocates a bigger block (usually ~2×), copies everything over (O(n) for that one append), and continues. Averaged over many appends the cost per append stays constant.',
  'The expensive operations are the ones that break contiguity: inserting or deleting in the middle must shift every element after the position, so both are O(n). If you find yourself deleting from the front repeatedly, you want a queue/deque, not an array.',
]
notes = [
  'Indexing is 0-based in Go, C++ and Java: a length-n array has valid indices 0 … n-1. arr[n] is out of bounds.',
  'Go slicing a[lo:hi] and Java subList(lo, hi) are half-open: they include lo, exclude hi. Length of the piece = hi - lo.',
  'Out-of-bounds: Go and Java throw/panic immediately (safe crash). C++ operator[] is undefined behavior — it may silently corrupt memory; use .at(i) while learning.',
  'Go slices share the underlying array: sub := nums[1:3] is a view, writing sub[0] changes nums[1]. Copy explicitly with copy(dst, src) if you need independence.',
  'C++ .size() returns an unsigned size_t — `nums.size() - 1` underflows to a huge number when empty. Compare with int i < (int)nums.size().',
]

[topic.syntax]
go = '''
nums := []int{3, 1, 4}        // slice literal
nums = append(nums, 9)         // grow
n := len(nums)                 // length
first, last := nums[0], nums[n-1]
sub := nums[1:3]               // [1,4] — half-open: index 1..2
grid := make([][]int, rows)    // 2-D: make each row
for i := range grid { grid[i] = make([]int, cols) }
for i, v := range nums { _ = i; _ = v } // index + value
'''
cpp = '''
vector<int> nums = {3, 1, 4};
nums.push_back(9);             // grow
int n = nums.size();           // size_t! cast or compare carefully
int first = nums[0], last = nums.back();
vector<vector<int>> grid(rows, vector<int>(cols, 0)); // 2-D filled with 0
for (int v : nums) { }         // value
for (int i = 0; i < n; i++) { } // index
'''
java = '''
int[] fixed = {3, 1, 4};        // fixed-size array
List<Integer> nums = new ArrayList<>(); // dynamic
nums.add(9);
int n = nums.size();            // fixed.length for arrays
int[][] grid = new int[rows][cols];     // 2-D, zero-filled
for (int v : fixed) { }         // value
for (int i = 0; i < n; i++) { } // index
'''


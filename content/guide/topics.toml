[[topic]]
id = 'unionfind'
title = 'Union Find (Disjoint Set Union)'
kind = 'structure'
emoji = '🔗'
what = [
  'Union-find answers one question — "are these two things in the same group?" — and supports one change: merge two groups. It stores each element as a node pointing at a parent, and a group is identified by the root its members climb to. Nothing else is stored: no member lists, no adjacency, no visited set.',
  'Two optimisations turn it from a linked list in disguise into a near-constant-time structure. Path compression re-points each node at its grandparent while walking up, so trees flatten a little on every query. Union by size hangs the smaller tree under the bigger one, so a tree never gets tall in the first place. Together they give an amortised cost of α(n) — the inverse Ackermann function, which is below 5 for any n a computer will ever hold.',
  "The reason it beats DFS on connectivity problems is that it is incremental: edges can arrive one at a time and every query in between is still answered instantly, where a DFS would have to re-run. That also makes it the natural fit for Kruskal's MST, for cycle detection while a graph is being built, and for anything phrased as \"process these merges in order\".",
]
notes = [
  'The parent array must be seeded with parent[i] = i. Forgetting it fails silently: every find returns 0 and everything looks connected.',
  'Union by size and path compression together are what buy α(n). With neither, a chain of unions builds an n-deep tree and each find becomes O(n).',
  'Compare find(a) with find(b), never parent[a] with parent[b] — the latter is wrong the moment either node sits below its root.',
  'Keys that are not small integers (emails, strings, coordinates) need an id map first: hash the key to 0…n-1 the first time it is seen, then run the array structure on the ids.',
  'The structure cannot un-merge. Problems that remove edges are usually solved by processing the input backwards, turning removals into additions.',
]

[topic.syntax]
go = '''
parent := make([]int, n)
size := make([]int, n)
for i := range parent { parent[i], size[i] = i, 1 }

func find(x int) int {
    for parent[x] != x {
        parent[x] = parent[parent[x]]  // path compression
        x = parent[x]
    }
    return x
}

func union(a, b int) bool {
    ra, rb := find(a), find(b)
    if ra == rb { return false }       // already together
    if size[ra] > size[rb] { ra, rb = rb, ra }
    parent[ra] = rb                    // smaller under bigger
    size[rb] += size[ra]
    return true
}
'''
cpp = '''
vector<int> parent(n), sz(n, 1);
iota(parent.begin(), parent.end(), 0);

int find(int x) {
    while (parent[x] != x) {
        parent[x] = parent[parent[x]];
        x = parent[x];
    }
    return x;
}

bool unite(int a, int b) {
    a = find(a), b = find(b);
    if (a == b) return false;
    if (sz[a] > sz[b]) swap(a, b);
    parent[a] = b;
    sz[b] += sz[a];
    return true;
}
'''
java = '''
int[] parent = new int[n], size = new int[n];
for (int i = 0; i < n; i++) { parent[i] = i; size[i] = 1; }

int find(int x) {
    while (parent[x] != x) {
        parent[x] = parent[parent[x]];
        x = parent[x];
    }
    return x;
}

boolean union(int a, int b) {
    int ra = find(a), rb = find(b);
    if (ra == rb) return false;
    if (size[ra] > size[rb]) { int t = ra; ra = rb; rb = t; }
    parent[ra] = rb;
    size[rb] += size[ra];
    return true;
}
'''


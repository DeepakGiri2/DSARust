[[topic]]
id = 'complexity'
title = 'Reading the Constraints'
kind = 'technique'
emoji = '⏱'
what = [
  'The constraints tell you the intended complexity before you have thought about the problem, and reading them first saves the twenty minutes usually spent optimising the wrong thing. A rough guide, at roughly 10⁸ simple operations per second: n ≤ 10 allows O(n!) or O(2ⁿ) brute force; n ≤ 20 says bitmask DP or subsets; n ≤ 500 allows O(n³); n ≤ 5000 allows O(n²); n ≤ 10⁵ means O(n log n) — sort, heap, or binary search; n ≤ 10⁷ means a single linear pass; and anything larger wants O(log n) or O(1), which means maths.',
  'Big-O deliberately drops constants and lower-order terms, so it describes growth, not speed. O(n) with a hash map can lose to O(n log n) with a sorted array at small n, because hashing has a constant factor and cache misses are expensive. Interviewers care about the exponent; production cares about both.',
  'Space complexity is asked about less and matters just as much. Recursion costs O(depth) in stack frames whether or not you allocated anything, and "in place" means O(1) *extra* — reusing the input is allowed, and is exactly what an interviewer means when they ask you to do better than O(n) space.',
]
notes = [
  'Analyse loops by counting how many times a line runs in total, not how deeply it is nested. A while loop inside a for loop is often linear overall — that is the whole point of the amortised argument behind two pointers and monotonic stacks.',
  'Sorting is O(n log n), so any solution that sorts cannot be better than that, no matter what follows.',
  'Recursion depth counts as space: an O(n)-deep recursion is O(n) space even with no allocation.',
  'For recursive divide-and-conquer, the master theorem shortcut: halving with O(1) work per level is O(log n), halving with O(n) work per level is O(n log n), and branching into two full-size subproblems is O(2ⁿ).',
  'State the complexity out loud before you start coding. If it does not fit the constraints, that is the cheapest possible moment to find out.',
]

[topic.syntax]
go = '''
// n <= 10        O(n!)  / O(2^n)   permutations, subsets, brute force
// n <= 20        O(2^n · n)        bitmask DP
// n <= 500       O(n^3)            Floyd-Warshall, interval DP
// n <= 5_000     O(n^2)            2-D DP, all pairs
// n <= 100_000   O(n log n)        sort, heap, binary search
// n <= 10_000_000 O(n)             one pass, counting
// n > 10^9       O(log n) / O(1)   maths, bit tricks

// values up to 10^9 fit in int32; sums of 10^5 of them do not.
// Go's int is 64-bit, so this is one worry fewer than in C++/Java.
'''
cpp = '''
// int      ~ 2.1e9      (use for indices, small values)
// long long ~ 9.2e18    (use for sums, products, prefix sums)
// double has 15-16 significant digits — never for money or equality

// A rough budget: 1e8 simple operations per second.
// 1e5 elements * log2(1e5) ~ 17 = 1.7e6 -> comfortably fast.
'''
java = '''
// int  ~ 2.1e9    long ~ 9.2e18
// (long) a * b    — cast BEFORE the multiply, not after

// Recursion depth: the JVM overflows around 10^4 frames by default.
// An O(n)-deep recursion over 10^5 elements will not survive; make it
// iterative or increase -Xss.
'''


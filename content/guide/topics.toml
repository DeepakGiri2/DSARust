[[topic]]
id = 'queue'
title = 'Queue & Deque (FIFO)'
kind = 'structure'
emoji = '🚶'
what = [
  'A queue is First-In-First-Out: enqueue at the back, dequeue from the front, both O(1). It is THE data structure of breadth-first search — the queue holds the frontier, and processing it level by level guarantees you reach every node via a shortest path (in unweighted graphs).',
  'A deque (double-ended queue) allows O(1) push/pop at both ends. Implementations use a ring buffer or doubly linked blocks so neither end requires shifting. The deque enables the monotonic-deque trick for Sliding Window Maximum: O(n) instead of O(n log n).',
  'BFS template: push the start, mark visited, loop while the queue is non-empty — pop front, process, push unvisited neighbors. Level-order variants snapshot len(queue) at the top of each round and process exactly that many nodes; that count is "one level".',
]
notes = [
  'Java naming trap: on Deque, push/pop work on the FRONT (stack semantics) while offer/poll default to back-in front-out (queue semantics). Mixing them is the classic BFS bug.',
  'The Go queue = queue[1:] idiom never reuses the freed front memory during one traversal — acceptable for interviews; a ring buffer or index pointer fixes it for production.',
  'BFS distance = number of levels processed; increment it once per level (using the levelSize snapshot), not once per node.',
]

[topic.syntax]
go = '''
queue := []int{}
queue = append(queue, 5)       // enqueue
front := queue[0]              // peek
queue = queue[1:]              // dequeue (view moves forward)
for len(queue) > 0 {
    levelSize := len(queue)    // BFS level-order snapshot
    for i := 0; i < levelSize; i++ { /* pop + push children */ }
}
'''
cpp = '''
queue<int> q;                  // #include <queue>
q.push(5);                     // enqueue at back
int front = q.front();         // peek
q.pop();                       // void — read front() first
// deque: both ends
deque<int> dq;
dq.push_front(1); dq.push_back(2);
dq.pop_front();   dq.pop_back();
'''
java = '''
Queue<Integer> q = new LinkedList<>(); // or ArrayDeque
q.offer(5);                    // enqueue
int front = q.peek();
int popped = q.poll();         // null if empty (remove() throws)
// deque: both ends
Deque<Integer> dq = new ArrayDeque<>();
dq.offerFirst(1); dq.offerLast(2);
dq.pollFirst();   dq.pollLast();
'''

[[topic.complexity]]
op = 'enqueue (push back)'
big = 'O(1)'

[[topic.complexity]]
op = 'dequeue (pop front)'
big = 'O(1)'
note = 'Go slice idiom: amortized, leaks a bit — fine for interviews'

[[topic.complexity]]

[[topic]]
id = 'stack'
title = 'Stack (LIFO)'
kind = 'structure'
emoji = '🥞'
what = [
  'A stack is Last-In-First-Out: you can only push onto the top, peek the top, and pop the top — all O(1). It is just a dynamic array where you only touch the end, which is why all three languages implement it with their array type rather than a dedicated class.',
  'Stacks shine whenever the most recent unfinished thing must be resolved first: matching brackets (push opens, pop on close), undo history, evaluating expressions, and — crucially — recursion itself. Every recursive algorithm secretly uses the call stack; any recursion can be rewritten with an explicit stack (that is exactly how iterative DFS works).',
  'The monotonic stack is a power-pattern: keep the stack sorted (say, decreasing) by popping everything smaller before pushing. Each element is pushed and popped at most once, so problems like Daily Temperatures or Largest Rectangle in Histogram run in O(n) instead of O(n²).',
]
notes = [
  'Popping an empty stack: Go slice pop panics on the index, C++ st.pop() is undefined behavior, Java pop() throws. Always guard with an emptiness check.',
  'C++ pop() returns void — read top() before popping. This surprises everyone once.',
  'Java: use ArrayDeque, not the legacy java.util.Stack (synchronized, slow, extends Vector).',
  'The Go pop is two steps on purpose: read the top, then reslice. stack[:len(stack)-1] is O(1) — it just shortens the view.',
]

[topic.syntax]
go = '''
stack := []int{}
stack = append(stack, 5)       // push
top := stack[len(stack)-1]     // peek
stack = stack[:len(stack)-1]   // pop (shrink by one)
empty := len(stack) == 0
'''
cpp = '''
stack<int> st;                 // #include <stack>
st.push(5);
int top = st.top();            // peek
st.pop();                      // void! read top() first
bool empty = st.empty();
// many prefer: vector<int> st; st.push_back / st.back() / st.pop_back()
'''
java = '''
Deque<Integer> st = new ArrayDeque<>(); // preferred over legacy Stack
st.push(5);                    // addFirst
int top = st.peek();
int popped = st.pop();
boolean empty = st.isEmpty();
'''


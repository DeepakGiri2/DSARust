[[topic]]
id = 'matrix'
title = 'Matrix Manipulation'
kind = 'technique'
emoji = '🔲'
what = [
  'Matrix problems are usually about index arithmetic under pressure, and the same three moves cover most of them. Rotating 90° clockwise in place is transpose (swap [r][c] with [c][r]) followed by reversing each row — two simple passes instead of one impossible-to-debug index formula. Spiral order is four boundaries (top, bottom, left, right) that close in, with a guard before the two return passes so a single leftover row or column is not emitted twice.',
  'The second recurring theme is doing it in place without a second matrix. Set Matrix Zeroes uses the first row and column as its own marker storage; Game of Life packs the next generation into a spare bit of each cell so neighbours still read the old value. Both are the same idea: find somewhere inside the data to store the marks.',
  'Traversals of a grid are graph traversals with the adjacency implied — the four (or eight) direction offsets are the edge list. Writing the offsets as a small array of pairs and looping over it beats four copy-pasted blocks, and it is where off-by-one bounds bugs stop hiding.',
]
notes = [
  'Rows are the first index and columns the second: grid[r][c], with r < rows and c < cols. Half of all matrix bugs are a swapped pair.',
  'Check bounds before dereferencing, not after — and in one expression: `nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] == 1`.',
  "A ragged matrix is a real input in Java (int[][] rows can differ in length). Read each row's own length rather than grid[0].length when it might vary.",
  'In C++, `vector<vector<int>> g(rows, vector<int>(cols))` allocates properly; `g[r][c]` on an empty outer vector is undefined behaviour, so check `!g.empty()` first.',
  'For spiral traversal, the guard `if (top <= bottom)` before the right-to-left pass, and `if (left <= right)` before the bottom-to-top pass, are what stop a single remaining line being printed twice.',
]

[topic.syntax]
go = '''
dirs := [][2]int{{-1, 0}, {1, 0}, {0, -1}, {0, 1}}
for _, d := range dirs {
    nr, nc := r+d[0], c+d[1]
    if nr < 0 || nr >= rows || nc < 0 || nc >= cols { continue }
    // visit grid[nr][nc]
}

// rotate 90° clockwise, in place
for r := 0; r < n; r++ {                    // transpose
    for c := r + 1; c < n; c++ {
        m[r][c], m[c][r] = m[c][r], m[r][c]
    }
}
for _, row := range m {                     // reverse each row
    for i, j := 0, n-1; i < j; i, j = i+1, j-1 {
        row[i], row[j] = row[j], row[i]
    }
}
'''
cpp = '''
int dr[] = {-1, 1, 0, 0}, dc[] = {0, 0, -1, 1};
for (int k = 0; k < 4; k++) {
    int nr = r + dr[k], nc = c + dc[k];
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
    // visit grid[nr][nc]
}

for (int r = 0; r < n; r++)                 // transpose
    for (int c = r + 1; c < n; c++)
        swap(m[r][c], m[c][r]);
for (auto& row : m) reverse(row.begin(), row.end());
'''
java = '''
int[][] dirs = {{-1, 0}, {1, 0}, {0, -1}, {0, 1}};
for (int[] d : dirs) {
    int nr = r + d[0], nc = c + d[1];
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
    // visit grid[nr][nc]
}

for (int r = 0; r < n; r++)                 // transpose
    for (int c = r + 1; c < n; c++) {
        int t = m[r][c]; m[r][c] = m[c][r]; m[c][r] = t;
    }
for (int[] row : m)                         // reverse each row
    for (int i = 0, j = n - 1; i < j; i++, j--) {
        int t = row[i]; row[i] = row[j]; row[j] = t;
    }
'''


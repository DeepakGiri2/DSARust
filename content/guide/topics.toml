[[topic]]
id = 'greedy'
title = 'Greedy'
kind = 'technique'
emoji = '🤑'
what = [
  'A greedy algorithm makes the locally best choice at each step and never reconsiders — no backtracking, no table of subproblems. When it works it is usually the fastest possible approach (one pass, O(1) extra space), but it only works when the problem has the greedy-choice property: a local optimum can always be extended to a global one.',
  "Recognizable examples: Maximum Subarray (Kadane's — a running sum that resets to 0 whenever it goes negative, because a negative prefix can only hurt); Jump Game (track the farthest reachable index; if the current index ever exceeds it, you're stuck); interval scheduling (sort by END time, always take the earliest-ending compatible interval — it leaves maximal room for the rest).",
  "The honest way to trust a greedy: an exchange argument — \"take any optimal solution; swap its first choice for the greedy choice; it stays optimal\" — repeated, this transforms any optimal solution into the greedy one. If you can't sketch that argument, suspect the greedy is wrong and think DP (Coin Change with coins {1,3,4} and amount 6 is the classic greedy-killer: greedy says 4+1+1, optimal is 3+3).",
]
notes = [
  "Greedy vs DP: if choices interact across the future (taking this now blocks something better later, in a way local info can't see), you need DP.",
  'Sorting by the right key IS the greedy insight in interval problems — end time for scheduling, start time for merging.',
  'Initialize best with the first element (not 0) when all values may be negative.',
]


# The NeetCode roadmap, as data.
#
# Categories render in the order they appear here; a problem shows up in a
# tier when its own tier is that tier or smaller (50 < 150 < 250).
# `slug` is optional and only needed when it differs from the title.
#
# Adding a problem here makes it appear in the app. Giving it a directory
# under problems/<slug>/ with a trace.rhai makes it animated. Neither needs
# a rebuild.


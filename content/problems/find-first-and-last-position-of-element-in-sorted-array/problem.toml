slug = 'find-first-and-last-position-of-element-in-sorted-array'
title = 'Find First and Last Position of Element in Sorted Array'
category = 'Binary Search'
difficulty = 'Medium'
tier = 'extra'
leetcode = '34'
complexity = 'O(log n) time · O(1) space'

description = 'Given a sorted array, find the first and last index of a target value. Return -1 -1 if it is absent.'
approach = 'Two lower-bound searches. The first index of target is the lower bound of target; the index after the last one is the lower bound of target + 1. Writing a single boundary search and calling it twice is far less error-prone than writing two subtly different loops, and neither loop needs an equality early-exit — which is precisely why the run of duplicates does not slow it down.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 16
min = -20
max = 20

[[inputs]]
name = 'target'
label = 'target'
type = 'int'
min = -20
max = 20

[default_input]
nums = [5, 7, 7, 8, 8, 8, 10]
target = 8

[[tests]]
expected = '3 5'
[tests.input]
nums = [5, 7, 7, 8, 8, 8, 10]
target = 8

[[tests]]
expected = '-1 -1'
[tests.input]
nums = [5, 7, 7, 8, 8, 10]
target = 6

[[tests]]
expected = '0 0'
[tests.input]
nums = [1]
target = 1

[[tests]]
expected = '0 1'
[tests.input]
nums = [2, 2]
target = 2

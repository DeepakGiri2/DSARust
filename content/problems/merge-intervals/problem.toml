slug = 'merge-intervals'
title = 'Merge Intervals'
category = 'Intervals'
difficulty = 'Medium'
tier = '50'
complexity = 'O(n log n) time · O(n) space'

description = 'Given an array of intervals where intervals[i] = [start, end], merge all overlapping intervals and return the non-overlapping intervals that cover all the original ones. Input is space-separated pairs like "1,3 2,6 8,10".'
approach = 'Sort the intervals by start. Sweep left to right keeping the last merged interval. If the next interval starts after that interval ends, it is disjoint → append it. Otherwise they overlap → extend the last interval’s end.'

[[inputs]]
name = 'intervals'
label = 'intervals (e.g. 1,3 2,6 8,10)'
type = 'string'
max_len = 120

[default_input]
intervals = '1,3 2,6 8,10 15,18'

[[tests]]
expected = '1,6 8,10 15,18'
[tests.input]
intervals = '1,3 2,6 8,10 15,18'

[[tests]]
expected = '1,5'
[tests.input]
intervals = '1,4 4,5'

[[tests]]
expected = '1,4'
[tests.input]
intervals = '1,4 2,3'

slug = 'insert-into-a-binary-search-tree'
title = 'Insert Into a Binary Search Tree'
category = 'Trees'
difficulty = 'Medium'
tier = '250'
leetcode = '701'
complexity = 'O(h) time · O(1) space (h = height)'

description = 'Insert a value into a binary search tree and return the root. The value is guaranteed not to be present already.'
approach = 'A BST already tells you where a value belongs: at every node the comparison rules out one entire subtree. Walk down following those comparisons until the side you want is empty, and hang the new node there. Nothing else moves, because that empty slot is the only place the value can sit without breaking the ordering.'

[[inputs]]
name = 'root'
label = "tree (level-order, 'n' = null)"
type = 'tree'
max_len = 80

[[inputs]]
name = 'val'
label = 'val'
type = 'int'
min = -100
max = 100

[default_input]
root = '4 2 7 1 3'
val = 5

[[tests]]
expected = '4 2 7 1 3 5'
[tests.input]
root = '4 2 7 1 3'
val = 5

[[tests]]
expected = '4 2 7 1 3 n n 0'
[tests.input]
root = '4 2 7 1 3'
val = 0

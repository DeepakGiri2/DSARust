slug = 'kth-largest-element-in-an-array'
title = 'Kth Largest Element in an Array'
category = 'Heap / Priority Queue'
difficulty = 'Medium'
tier = '50'
complexity = 'O(n log k) time · O(k) space'

description = 'Given an integer array nums and an integer k, return the kth largest element in the array. This is the kth largest in sorted order, not the kth distinct element.'
approach = 'Keep a min-heap of size k. Push each value; whenever the heap grows past k, pop its smallest element. The heap always holds the k largest values seen so far, so its root (the smallest of those k) is exactly the kth largest overall.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'k'
label = 'k'
type = 'int'

[default_input]
nums = [3, 2, 1, 5, 6, 4]
k = 2

[[tests]]
expected = '5'
[tests.input]
nums = [3, 2, 1, 5, 6, 4]
k = 2

[[tests]]
expected = '4'
[tests.input]
nums = [3, 2, 3, 1, 2, 4, 5, 5, 6]
k = 4

[[tests]]
expected = '1'
[tests.input]
nums = [1]
k = 1

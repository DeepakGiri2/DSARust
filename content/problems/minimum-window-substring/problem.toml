slug = 'minimum-window-substring'
title = 'Minimum Window Substring'
category = 'Sliding Window'
difficulty = 'Hard'
tier = '150'
complexity = 'O(s + t) time · O(alphabet) space'

description = 'Given strings s and t, return the shortest substring of s that contains every character of t (including duplicates). If there is no such window, return the empty string.'
approach = 'Expand the right edge until the window satisfies every needed count, then contract the left edge as far as it stays valid, recording the smallest valid window seen. have counts how many distinct needed characters are fully met.'

[[inputs]]
name = 's'
label = 's'
type = 'string'
max_len = 20

[[inputs]]
name = 't'
label = 't'
type = 'string'
max_len = 8

[default_input]
s = 'ADOBECODEBANC'
t = 'ABC'

[[tests]]
expected = 'BANC'
[tests.input]
s = 'ADOBECODEBANC'
t = 'ABC'

[[tests]]
expected = 'a'
[tests.input]
s = 'a'
t = 'a'

[[tests]]
expected = ''
[tests.input]
s = 'a'
t = 'aa'

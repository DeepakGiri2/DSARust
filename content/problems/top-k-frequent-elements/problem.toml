slug = 'top-k-frequent-elements'
title = 'Top K Frequent Elements'
category = 'Arrays & Hashing'
difficulty = 'Medium'
tier = '50'
complexity = 'O(n) time · O(n) space'

description = 'Given an integer array nums and an integer k, return the k most frequent elements.'
approach = 'Count every value with a hash map. Then bucket the values by frequency: bucket[f] holds every value that appears exactly f times. Because f is at most n, walking buckets from highest frequency downward collects the top k in linear time — no sorting needed.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'k'
label = 'k'
type = 'int'

[default_input]
nums = [1, 1, 1, 2, 2, 3]
k = 2

[[tests]]
expected = '1 2'
[tests.input]
nums = [1, 1, 1, 2, 2, 3]
k = 2

[[tests]]
expected = '4'
[tests.input]
nums = [4, 4, 5, 5, 6]
k = 1

[[tests]]
expected = '7'
[tests.input]
nums = [7]
k = 1

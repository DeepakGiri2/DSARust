slug = 'trapping-rain-water'
title = 'Trapping Rain Water'
category = 'Two Pointers'
difficulty = 'Hard'
tier = '150'
complexity = 'O(n) time · O(1) space'

description = 'Given n non-negative bars forming an elevation map, compute how much rain water is trapped between the bars after it rains. The animation walks two pointers inward, tracking the tallest wall seen from each side.'
approach = 'Two pointers close in from both ends. The water over a bar is capped by the shorter of the tallest walls to its left and right. Whichever side is currently shorter is safe to resolve, so process that pointer and add leftMax/rightMax minus the bar height.'

[[inputs]]
name = 'height'
label = 'height'
type = 'int-array'
max_len = 40

[default_input]
height = [4, 2, 0, 3, 2, 5]

[[tests]]
expected = '9'
[tests.input]
height = [4, 2, 0, 3, 2, 5]

[[tests]]
expected = '6'
[tests.input]
height = [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]

[[tests]]
expected = '1'
[tests.input]
height = [4, 2, 3]

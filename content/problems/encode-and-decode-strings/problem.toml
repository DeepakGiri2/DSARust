slug = 'encode-and-decode-strings'
title = 'Encode and Decode Strings'
category = 'Arrays & Hashing'
difficulty = 'Medium'
tier = '150'
complexity = 'O(n) time · O(n) space (n = total characters)'

description = 'Design an algorithm to encode a list of strings into a single string, and decode that string back into the original list. Watch the length-prefixed buffer being built and then parsed back word by word.'
approach = "Length-prefix encoding: for each word write its length, a '#' delimiter, then the word itself. To decode, read digits up to the '#' to learn the length, then slice off exactly that many characters."

[[inputs]]
name = 'words'
label = 'words (space-separated)'
type = 'string'
max_len = 40

[default_input]
words = 'neet code love you'

[[tests]]
expected = 'neet code love you'
[tests.input]
words = 'neet code love you'

[[tests]]
expected = 'a bb ccc'
[tests.input]
words = 'a bb ccc'

[[tests]]
expected = 'hello'
[tests.input]
words = 'hello'

slug = 'number-of-1-bits'
title = 'Number of 1 Bits'
category = 'Bit Manipulation'
difficulty = 'Easy'
tier = '150'
complexity = 'O(number of set bits) time · O(1) space'

description = 'Count the number of 1 bits in the binary representation of an unsigned integer.'
approach = 'n & (n-1) clears the lowest set bit: subtracting 1 flips that bit to 0 and everything below it to 1, so the AND wipes exactly one bit. Loop until zero and the iteration count is the answer — no scanning of the zeros.'

[[inputs]]
name = 'n'
label = 'n'
type = 'int'
min = 0
max = 255

[default_input]
n = 43

[[tests]]
expected = '4'
[tests.input]
n = 43

[[tests]]
expected = '1'
[tests.input]
n = 128

slug = 'reverse-linked-list-ii'
title = 'Reverse Linked List II'
category = 'Linked List'
difficulty = 'Medium'
tier = 'extra'
leetcode = '92'
complexity = 'O(n) time · O(1) space'

description = 'Reverse the nodes of a list from position left to position right (1-indexed), in one pass.'
approach = 'Head insertion. Park a pointer just before the sublist, then repeatedly take the node *after* the current one and move it to the front of the sublist. Each move is three pointer writes and reverses one more element, so the sublist turns inside out without a second pass and without ever detaching from the list around it. A sentinel before the head removes the special case where left = 1.'

[[inputs]]
name = 'list'
label = 'list'
type = 'int-array'
max_len = 12
min = -50
max = 50

[[inputs]]
name = 'left'
label = 'left'
type = 'int'
min = 1
max = 12

[[inputs]]
name = 'right'
label = 'right'
type = 'int'
min = 1
max = 12

[default_input]
list = [1, 2, 3, 4, 5]
left = 2
right = 4

[[tests]]
expected = '1 4 3 2 5'
[tests.input]
list = [1, 2, 3, 4, 5]
left = 2
right = 4

[[tests]]
expected = '5 4 3 2 1'
[tests.input]
list = [1, 2, 3, 4, 5]
left = 1
right = 5

[[tests]]
expected = '5'
[tests.input]
list = [5]
left = 1
right = 1

[[tests]]
expected = '5 3'
[tests.input]
list = [3, 5]
left = 1
right = 2

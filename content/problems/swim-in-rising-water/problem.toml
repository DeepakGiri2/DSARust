slug = 'swim-in-rising-water'
title = 'Swim in Rising Water'
category = 'Advanced Graphs'
difficulty = 'Hard'
tier = '150'
leetcode = '778'
complexity = 'O(n² log n) time · O(n²) space'

description = 'Water rises over a grid of elevations; at time t you may swim between adjacent cells whose elevations are both at most t. Return the earliest time you can reach the bottom-right corner from the top-left.'
approach = "A path's cost is not the sum of its cells but the *maximum* — you wait for the highest one. Dijkstra still applies with that change: relaxing takes the larger of the path's current maximum and the next cell's elevation instead of adding. The greedy argument survives because the maximum is also monotone: extending a path can never lower its cost."

[[inputs]]
name = 'grid'
label = 'grid'
type = 'string'
max_len = 64
help = 'rows separated by spaces, values by commas'

[default_input]
grid = '0,2 1,3'

[[tests]]
expected = '3'
[tests.input]
grid = '0,2 1,3'

[[tests]]
expected = '16'
[tests.input]
grid = '0,1,2,3,4 24,23,22,21,5 12,13,14,15,16 11,17,18,19,20 10,9,8,7,6'

[[tests]]
expected = '0'
[tests.input]
grid = '0'

slug = 'interval-list-intersections'
title = 'Interval List Intersections'
category = 'Intervals'
difficulty = 'Medium'
tier = '250'
leetcode = '986'
complexity = 'O(m + n) time · O(1) extra space'

description = 'Given two lists of disjoint, sorted intervals, return their pairwise intersections.'
approach = 'Two intervals overlap on the range from the later of their starts to the earlier of their ends — and that range is empty exactly when they do not overlap, so one formula covers both cases. Because both lists are sorted and disjoint, whichever interval ends first can never meet anything later in the other list, so advancing past it is safe. One pass over each list is enough.'

[[inputs]]
name = 'a'
label = 'a'
type = 'string'
max_len = 60
help = "'start end' pairs, comma separated"

[[inputs]]
name = 'b'
label = 'b'
type = 'string'
max_len = 60
help = "'start end' pairs, comma separated"

[default_input]
a = '0 2, 5 10, 13 23, 24 25'
b = '1 5, 8 12, 15 24, 25 26'

[[tests]]
expected = '1-2 5-5 8-10 15-23 24-24 25-25'
[tests.input]
a = '0 2, 5 10, 13 23, 24 25'
b = '1 5, 8 12, 15 24, 25 26'

[[tests]]
expected = '3-7'
[tests.input]
a = '1 7'
b = '3 10'

[[tests]]
expected = '(none)'
[tests.input]
a = '1 3, 5 9'
b = '4 4'

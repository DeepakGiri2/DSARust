slug = 'sliding-window-maximum'
title = 'Sliding Window Maximum'
category = 'Sliding Window'
difficulty = 'Hard'
tier = '150'
complexity = 'O(n) time · O(k) space'

description = 'Given an array nums and a window size k, return the maximum of every contiguous window of size k as the window slides from left to right.'
approach = 'Keep a deque of indices whose values are in decreasing order. The front is always the current window maximum. Pop smaller values from the back before pushing, and drop the front once it slides out of the window.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'k'
label = 'k'
type = 'int'
min = 1

[default_input]
nums = [1, 3, -1, -3, 5, 3, 6, 7]
k = 3

[[tests]]
expected = '3 3 5 5 6 7'
[tests.input]
nums = [1, 3, -1, -3, 5, 3, 6, 7]
k = 3

[[tests]]
expected = '1'
[tests.input]
nums = [1]
k = 1

[[tests]]
expected = '9 8 7'
[tests.input]
nums = [9, 8, 7, 6]
k = 2

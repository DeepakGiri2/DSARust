slug = 'coin-change'
title = 'Coin Change'
category = '1-D Dynamic Programming'
difficulty = 'Medium'
tier = '50'
complexity = 'O(amount · coins) time · O(amount) space'

description = 'Given coin denominations and a target amount, return the fewest coins that sum to the amount, or -1 if it is impossible. Watch dp[a] — the fewest coins to make amount a — fill from 1 up to the target.'
approach = 'dp[a] = min over coins c of dp[a-c] + 1. Start every amount at ∞ (unreachable) except dp[0] = 0. For each amount, try every coin: if the coin fits, making a costs one more coin than making a-c.'

[[inputs]]
name = 'coins'
label = 'coins'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'amount'
label = 'amount'
type = 'int'
min = 0
max = 20

[default_input]
coins = [1, 2, 5]
amount = 11

[[tests]]
expected = '3'
[tests.input]
coins = [1, 2, 5]
amount = 11

[[tests]]
expected = '-1'
[tests.input]
coins = [2]
amount = 3

[[tests]]
expected = '2'
[tests.input]
coins = [1, 3, 4]
amount = 6

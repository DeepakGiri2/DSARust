slug = 'network-delay-time'
title = 'Network Delay Time'
category = 'Advanced Graphs'
difficulty = 'Medium'
tier = '150'
leetcode = '743'
complexity = 'O(n² + edges) time · O(n + edges) space'

description = 'A signal is sent from one node along directed edges with travel times. Return how long it takes to reach every node, or -1 if some node is unreachable.'
approach = "Dijkstra. The whole algorithm rests on one fact: among the nodes not yet settled, the closest one's distance is already final, because any other route to it would have to pass through a node that is further away and therefore be longer. Settle that node, relax its outgoing edges, repeat. The answer is the largest settled distance — the signal is only finished when the slowest arrival happens."

[[inputs]]
name = 'times'
label = 'times'
type = 'string'
max_len = 60
help = "'from to weight' triples, comma separated"

[[inputs]]
name = 'n'
label = 'n'
type = 'int'
min = 1
max = 8

[[inputs]]
name = 'k'
label = 'starting node'
type = 'int'
min = 1
max = 8

[default_input]
times = '2 1 1, 2 3 1, 3 4 1'
n = 4
k = 2

[[tests]]
expected = '2'
[tests.input]
times = '2 1 1, 2 3 1, 3 4 1'
n = 4
k = 2

[[tests]]
expected = '1'
[tests.input]
times = '1 2 1'
n = 2
k = 1

[[tests]]
expected = '-1'
[tests.input]
times = '1 2 1'
n = 2
k = 2

slug = 'candy'
title = 'Candy'
category = 'Greedy'
difficulty = 'Hard'
tier = '250'
leetcode = '135'
complexity = 'O(n) time · O(n) space'

description = 'Each child gets at least one sweet, and a child rated higher than an immediate neighbour must get more than that neighbour. Find the smallest total.'
approach = "The rule looks at both neighbours at once, which a single pass cannot honour. Split it: one left-to-right pass satisfies every 'higher than my left neighbour' constraint, and a right-to-left pass then satisfies the right-hand ones — taking a maximum rather than overwriting, so the first pass's work survives. Because each pass only ever increases a value by the minimum needed, the result is the smallest total that satisfies both."

[[inputs]]
name = 'ratings'
label = 'ratings'
type = 'int-array'
max_len = 12
min = 0
max = 20

[default_input]
ratings = [1, 0, 2]

[[tests]]
expected = '5'
[tests.input]
ratings = [1, 0, 2]

[[tests]]
expected = '4'
[tests.input]
ratings = [1, 2, 2]

[[tests]]
expected = '7'
[tests.input]
ratings = [1, 3, 2, 2, 1]

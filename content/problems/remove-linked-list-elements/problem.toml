slug = 'remove-linked-list-elements'
title = 'Remove Linked List Elements'
category = 'Linked List'
difficulty = 'Easy'
tier = '250'
leetcode = '203'
complexity = 'O(n) time · O(1) space'

description = 'Remove every node holding a given value from a singly linked list.'
approach = "Deleting a node means changing the *previous* node's link, which makes the head a special case — it has no previous node. A sentinel node placed in front of the head removes that asymmetry entirely: every real node now has a predecessor, so one loop handles all of them and the answer is simply whatever the sentinel ends up pointing at."

[[inputs]]
name = 'list'
label = 'list'
type = 'int-array'
max_len = 12
min = 0
max = 99

[[inputs]]
name = 'val'
label = 'val'
type = 'int'
min = 0
max = 99

[default_input]
list = [1, 2, 6, 3, 4, 5, 6]
val = 6

[[tests]]
expected = '1 2 3 4 5'
[tests.input]
list = [1, 2, 6, 3, 4, 5, 6]
val = 6

[[tests]]
expected = '2 3'
[tests.input]
list = [1, 2, 3]
val = 1

[[tests]]
expected = '8'
[tests.input]
list = [7, 7, 7, 8]
val = 7

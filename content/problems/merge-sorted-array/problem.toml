slug = 'merge-sorted-array'
title = 'Merge Sorted Array'
category = 'Two Pointers'
difficulty = 'Easy'
tier = '250'
complexity = 'O(m + n) time · O(1) space'

description = 'nums1 has m sorted values followed by n empty slots; nums2 has n sorted values. Merge nums2 into nums1 so nums1 stays sorted, writing from the back so nothing is overwritten before it is copied.'
approach = 'Fill nums1 from its last slot backward. Compare the largest remaining value of each array and drop the bigger one into the current back slot. Working right-to-left means the slot being written is always past everything still unread.'

[[inputs]]
name = 'nums1vals'
label = 'nums1 (m values)'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'nums2'
label = 'nums2'
type = 'int-array'
max_len = 40

[default_input]
nums1vals = [1, 2, 3]
nums2 = [2, 5, 6]

[[tests]]
expected = '1 2 2 3 5 6'
[tests.input]
nums1vals = [1, 2, 3]
nums2 = [2, 5, 6]

[[tests]]
expected = '1'
[tests.input]
nums1vals = [1]
nums2 = []

[[tests]]
expected = '1 2 3 4 5 6'
[tests.input]
nums1vals = [4, 5, 6]
nums2 = [1, 2, 3]

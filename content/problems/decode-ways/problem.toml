slug = 'decode-ways'
title = 'Decode Ways'
category = '1-D Dynamic Programming'
difficulty = 'Medium'
tier = '150'
leetcode = '91'
complexity = 'O(n) time · O(1) space'

description = 'A digit string encodes letters with A = 1 through Z = 26. Count how many different letter strings it could decode to.'
approach = 'Every decoding ends with either a one-digit letter or a two-digit one, so the count at position i is the count one back plus the count two back — Fibonacci with conditions attached. The conditions are what carry the real content: a single digit only works if it is not 0, and a pair only if it reads between 10 and 26, which rules out both 0-leading pairs and anything above Z.'


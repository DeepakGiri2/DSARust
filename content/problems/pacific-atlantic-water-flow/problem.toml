slug = 'pacific-atlantic-water-flow'
title = 'Pacific Atlantic Water Flow'
category = 'Graphs'
difficulty = 'Medium'
tier = '150'
leetcode = '417'
complexity = 'O(rows · cols) time · O(rows · cols) space'

description = 'Water flows from a cell to any neighbour of equal or lower height. Find every cell from which water can reach both the Pacific (top and left edges) and the Atlantic (bottom and right edges).'
approach = 'Testing each cell separately repeats enormous amounts of work. Reverse the flow instead: start at the oceans and move *uphill*, to neighbours of equal or greater height. One such search per ocean marks everything that drains into it, and the answer is the intersection — two passes over the grid rather than one search per cell.'

[[inputs]]
name = 'heights'
label = 'heights'
type = 'string'
max_len = 60
help = 'rows separated by spaces, values by commas'

[default_input]
heights = '1,2,3 8,9,4 7,6,5'

[[tests]]
expected = '0,2 1,0 1,1 1,2 2,0 2,1 2,2'
[tests.input]
heights = '1,2,3 8,9,4 7,6,5'

[[tests]]
expected = '0,4 1,3 1,4 2,2 3,0 3,1 4,0'
[tests.input]
heights = '1,2,2,3,5 3,2,3,4,4 2,4,5,3,1 6,7,1,4,5 5,1,1,2,4'

[[tests]]
expected = '0,0'
[tests.input]
heights = '1'

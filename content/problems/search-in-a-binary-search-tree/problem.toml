slug = 'search-in-a-binary-search-tree'
title = 'Search in a Binary Search Tree'
category = 'Trees'
difficulty = 'Easy'
tier = '250'
leetcode = '700'
complexity = 'O(h) time · O(1) space (h = height)'

description = 'Find the node with a given value in a binary search tree and return the subtree rooted there, or nil if the value is absent.'
approach = 'One comparison per node, and each one discards an entire subtree: smaller means everything to the right is irrelevant, larger means everything to the left is. That is binary search with links instead of indices — no stack, no recursion, just a pointer walking down.'

[[inputs]]
name = 'root'
label = "tree (level-order, 'n' = null)"
type = 'tree'
max_len = 80

[[inputs]]
name = 'val'
label = 'val'
type = 'int'
min = -100
max = 100

[default_input]
root = '4 2 7 1 3'
val = 2

[[tests]]
expected = '2 1 3'
[tests.input]
root = '4 2 7 1 3'
val = 2

[[tests]]
expected = 'nil'
[tests.input]
root = '4 2 7 1 3'
val = 5

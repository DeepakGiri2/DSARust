slug = 'longest-consecutive-sequence'
title = 'Longest Consecutive Sequence'
category = 'Arrays & Hashing'
difficulty = 'Medium'
tier = '50'
complexity = 'O(n) time · O(n) space'

description = 'Given an unsorted array of integers nums, return the length of the longest sequence of consecutive integers (values that differ by 1). Must run in O(n).'
approach = 'Drop every value into a hash set for O(1) lookups. A value n only starts a run if n−1 is absent (otherwise a longer run already covers it). From each true start, walk n, n+1, n+2, … while they exist, counting the length, and keep the best.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 40

[default_input]
nums = [100, 4, 200, 1, 3, 2]

[[tests]]
expected = '4'
[tests.input]
nums = [100, 4, 200, 1, 3, 2]

[[tests]]
expected = '7'
[tests.input]
nums = [0, 3, 7, 2, 5, 8, 4, 6]

[[tests]]
expected = '3'
[tests.input]
nums = [1, 2, 0, 1]

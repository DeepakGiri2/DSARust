slug = 'eliminate-maximum-number-of-monsters'
title = 'Eliminate Maximum Number of Monsters'
category = 'Greedy'
difficulty = 'Medium'
tier = '250'
leetcode = '1921'
complexity = 'O(n log n) time · O(n) space'

description = 'Monsters advance at fixed speeds and you may eliminate one per minute, starting at minute 0. Return the most that can be eliminated before any of them arrives.'
approach = 'Shoot whatever arrives soonest. The exchange argument is immediate: if a later-arriving monster were shot first, swapping the two shots can only help, since the earlier one still had time and the later one certainly does. So sort by arrival time and walk — the k-th monster shot must arrive strictly after minute k, and the first failure ends the game.'

[[inputs]]
name = 'dist'
label = 'dist'
type = 'int-array'
max_len = 10
min = 1
max = 50

[[inputs]]
name = 'speed'
label = 'speed'
type = 'int-array'
max_len = 10
min = 1
max = 20

[default_input]
dist = [1, 3, 4]
speed = [1, 1, 1]

[[tests]]
expected = '3'
[tests.input]
dist = [1, 3, 4]
speed = [1, 1, 1]

[[tests]]
expected = '1'
[tests.input]
dist = [1, 1, 2, 3]
speed = [1, 1, 1, 1]

[[tests]]
expected = '1'
[tests.input]
dist = [3, 2, 4]
speed = [5, 3, 2]

slug = 'reorder-list'
title = 'Reorder List'
category = 'Linked List'
difficulty = 'Medium'
tier = '150'
complexity = 'O(n) time · O(1) space'

description = 'Reorder a list so it alternates first, last, second, second-last, and so on.'
approach = 'Three standard moves in sequence: find the middle with slow/fast pointers, reverse the second half, then weave the two halves together. Each is a linear pass and none needs extra storage.'

[[inputs]]
name = 'list'
label = 'list'
type = 'int-array'
max_len = 12
min = 0
max = 99

[default_input]
list = [1, 2, 3, 4, 5]

[[tests]]
expected = '1 4 2 3'
[tests.input]
list = [1, 2, 3, 4]

[[tests]]
expected = '1 5 2 4 3'
[tests.input]
list = [1, 2, 3, 4, 5]

slug = 'swap-nodes-in-pairs'
title = 'Swap Nodes in Pairs'
category = 'Linked List'
difficulty = 'Medium'
tier = '250'
leetcode = '24'
complexity = 'O(n) time · O(1) space'

description = 'Swap every two adjacent nodes of a linked list, changing the links rather than the values.'
approach = "Swapping two nodes touches three links, not two: the pair's own two links plus the one that points into the pair from outside. A sentinel supplies that outside link for the first pair, so all pairs are handled identically. The order of the three rewrites matters — each one must happen while the pointer it needs still exists."

[[inputs]]
name = 'list'
label = 'list'
type = 'int-array'
max_len = 12
min = 0
max = 99

[default_input]
list = [1, 2, 3, 4]

[[tests]]
expected = '2 1 4 3'
[tests.input]
list = [1, 2, 3, 4]

[[tests]]
expected = '2 1 3'
[tests.input]
list = [1, 2, 3]

[[tests]]
expected = '1'
[tests.input]
list = [1]

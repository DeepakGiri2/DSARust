slug = 'graph-valid-tree'
title = 'Graph Valid Tree'
category = 'Graphs'
difficulty = 'Medium'
tier = '150'
leetcode = '261'
complexity = 'O(n · α(n)) time · O(n) space'

description = 'Given n nodes and a list of undirected edges, return true if they form a valid tree.'
approach = 'A tree is exactly a connected graph with no cycles, and for n nodes those two conditions collapse into one plus a count: with exactly n-1 edges, acyclic implies connected. So check the edge count first, then use union-find to reject any edge whose endpoints are already joined. Passing both means the graph is a tree without ever testing connectivity directly.'

[[inputs]]
name = 'n'
label = 'n'
type = 'int'
min = 1
max = 10

[[inputs]]
name = 'edges'
label = 'edges'
type = 'string'
max_len = 60
help = "pairs 'a b', comma separated (may be empty)"

[default_input]
n = 5
edges = '0 1, 0 2, 0 3, 1 4'

[[tests]]
expected = 'true'
[tests.input]
n = 5
edges = '0 1, 0 2, 0 3, 1 4'

[[tests]]
expected = 'false'
[tests.input]
n = 5
edges = '0 1, 1 2, 2 3, 1 3, 1 4'

[[tests]]
expected = 'true'
[tests.input]
n = 4
edges = '0 1, 2 3, 1 2'

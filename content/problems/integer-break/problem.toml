slug = 'integer-break'
title = 'Integer Break'
category = '1-D Dynamic Programming'
difficulty = 'Medium'
tier = '250'
leetcode = '343'
complexity = 'O(n²) time · O(n) space'

description = 'Split an integer into at least two positive parts so that their product is as large as possible, and return that product.'
approach = "For each first part j, the rest is either left whole — giving j · (n - j) — or broken up further, giving j · dp[n - j]. Taking the larger of those two is what encodes 'at least two parts': the whole-remainder option keeps the split legal, and the dp option lets it go deeper only when that actually helps."


slug = 'reverse-nodes-in-k-group'
title = 'Reverse Nodes in K-Group'
category = 'Linked List'
difficulty = 'Hard'
tier = '150'
leetcode = '25'
complexity = 'O(n) time · O(1) space'

description = 'Reverse the nodes of a linked list k at a time. A trailing group shorter than k is left as it is.'
approach = 'Check before you commit: walk k nodes ahead first, and if the list runs out, stop — the leftover group must stay in order, and a reversal already started cannot be cheaply undone. Reversing a group is the ordinary reversal loop with a different stop condition: instead of running to nil it runs to the node after the group, which is what leaves the group correctly stitched to the tail.'

[[inputs]]
name = 'list'
label = 'list'
type = 'int-array'
max_len = 12
min = 0
max = 99

[[inputs]]
name = 'k'
label = 'k'
type = 'int'
min = 1
max = 6

[default_input]
list = [1, 2, 3, 4, 5]
k = 2

[[tests]]
expected = '2 1 4 3 5'
[tests.input]
list = [1, 2, 3, 4, 5]
k = 2

[[tests]]
expected = '3 2 1 4 5'
[tests.input]
list = [1, 2, 3, 4, 5]
k = 3

[[tests]]
expected = '4 3 2 1'
[tests.input]
list = [1, 2, 3, 4]
k = 4

slug = 'random-pick-with-weight'
title = 'Random Pick With Weight'
category = 'Design'
difficulty = 'Medium'
tier = 'extra'
leetcode = '528'
complexity = 'O(n) build · O(log n) per pick · O(n) space'

description = 'Given an array of positive weights, return a random index with probability proportional to its weight.'
approach = 'Lay the weights end to end on a number line: index i owns the segment (prefix[i-1], prefix[i]]. A uniform draw in 1…total lands in exactly one segment, and the index that owns it is the first prefix value greater than or equal to the draw — a lower-bound binary search. Building the prefix array once turns each pick into a logarithmic lookup.'

[[inputs]]
name = 'w'
label = 'w'
type = 'int-array'
max_len = 10
min = 1
max = 20

[[inputs]]
name = 'draws'
label = 'draws'
type = 'string'
max_len = 40
help = 'the random values 1…total that the picks land on'

[default_input]
w = [1, 3, 2]
draws = '1, 2, 4, 5, 6'

[[tests]]
expected = '0 1 1 2 2'
[tests.input]
w = [1, 3, 2]
draws = '1, 2, 4, 5, 6'

[[tests]]
expected = '0'
[tests.input]
w = [1]
draws = '1'

[[tests]]
expected = '0 1 1 2 2'
[tests.input]
w = [2, 5, 3]
draws = '2, 3, 7, 8, 10'

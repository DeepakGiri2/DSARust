slug = 'summary-ranges'
title = 'Summary Ranges'
category = 'Intervals'
difficulty = 'Easy'
tier = 'extra'
leetcode = '228'
complexity = 'O(n) time · O(1) extra space'

description = 'Given a sorted array of distinct integers, return the smallest sorted list of ranges that covers exactly the numbers in the array — "a->b" for a run, "a" for a lone number.'
approach = 'One pass with two indices: remember where a run started, walk forward while each value is exactly one more than the last, and emit when the run breaks. Because the input is sorted and distinct, a run breaks exactly when nums[i+1] != nums[i] + 1 — no lookahead beyond one element and no set is needed.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 14
min = -30
max = 60

[default_input]
nums = [0, 1, 2, 4, 5, 7]

[[tests]]
expected = '0->2,4->5,7'
[tests.input]
nums = [0, 1, 2, 4, 5, 7]

[[tests]]
expected = '0,2->4,6,8->9'
[tests.input]
nums = [0, 2, 3, 4, 6, 8, 9]

[[tests]]
expected = '1'
[tests.input]
nums = [1]

[[tests]]
expected = '1->3'
[tests.input]
nums = [1, 2, 3]

slug = 'two-sum-ii-input-array-is-sorted'
title = 'Two Sum II — Sorted Array'
category = 'Two Pointers'
difficulty = 'Medium'
tier = '50'
complexity = 'O(n) time · O(1) space'

description = 'Given a 1-indexed array of integers sorted in non-decreasing order, find two numbers that add up to a target and return their 1-based indices. Uses O(1) extra space.'
approach = 'Two pointers from both ends. If the sum is too small, only moving the left pointer up can increase it; if too big, only moving the right pointer down can decrease it. Sortedness makes each move safe.'

[[inputs]]
name = 'numbers'
label = 'numbers (sorted)'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'target'
label = 'target'
type = 'int'

[default_input]
numbers = [1, 3, 4, 5, 7, 10, 11]
target = 9

[[tests]]
expected = '3 4'
[tests.input]
numbers = [1, 3, 4, 5, 7, 10, 11]
target = 9

[[tests]]
expected = '1 2'
[tests.input]
numbers = [2, 7, 11, 15]
target = 9

slug = 'merge-two-binary-trees'
title = 'Merge Two Binary Trees'
category = 'Trees'
difficulty = 'Easy'
tier = '250'
leetcode = '617'
complexity = 'O(min(n, m)) time · O(min(n, m)) space'

description = 'Overlay two binary trees. Where both have a node, the merged node holds the sum; where only one does, that whole subtree is used as-is.'
approach = 'Walk both trees in lockstep. If one side is missing, the other side is already the answer for that entire subtree — return it whole and stop descending, which is why the cost is bounded by the *smaller* tree. Otherwise make a node holding the sum and merge the two left children and the two right children.'

[[inputs]]
name = 'root1'
label = "tree A (level-order, 'n' = null)"
type = 'tree'
max_len = 80

[[inputs]]
name = 'root2'
label = "tree B (level-order, 'n' = null)"
type = 'tree'
max_len = 80

[default_input]
root1 = '1 3 2 5'
root2 = '2 1 3 n 4 n 7'

[[tests]]
expected = '3 4 5 5 4 n 7'
[tests.input]
root1 = '1 3 2 5'
root2 = '2 1 3 n 4 n 7'

[[tests]]
expected = '2 2'
[tests.input]
root1 = '1'
root2 = '1 2'

slug = 'search-in-rotated-sorted-array'
title = 'Search in Rotated Sorted Array'
category = 'Binary Search'
difficulty = 'Medium'
tier = '50'
complexity = 'O(log n) time · O(1) space'

description = 'An ascending sorted array of distinct integers has been rotated at an unknown pivot. Given nums and a target, return the index of target, or -1 if it is absent. Must run in O(log n).'
approach = 'Binary search with a twist: at each mid, one of the two halves [lo..mid] or [mid..hi] is guaranteed to be sorted. Detect which half is sorted, test whether the target falls inside that sorted half, and discard the other half.'

[[inputs]]
name = 'nums'
label = 'nums (rotated sorted)'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'target'
label = 'target'
type = 'int'

[default_input]
nums = [4, 5, 6, 7, 0, 1, 2]
target = 0

[[tests]]
expected = '4'
[tests.input]
nums = [4, 5, 6, 7, 0, 1, 2]
target = 0

[[tests]]
expected = '-1'
[tests.input]
nums = [4, 5, 6, 7, 0, 1, 2]
target = 3

[[tests]]
expected = '0'
[tests.input]
nums = [1]
target = 1

slug = 'frequency-of-the-most-frequent-element'
title = 'Frequency of the Most Frequent Element'
category = 'Sliding Window'
difficulty = 'Medium'
tier = '250'
complexity = 'O(n log n) time · O(1) extra space'

description = 'Given an array nums and a budget k of increments (each op adds 1 to a chosen element), return the highest frequency any single value can reach. After sorting, a sliding window marks the elements we raise up to its rightmost value.'
approach = 'Sort nums. For a window [left..right], the cost to raise every element up to nums[right] is nums[right]·len − windowSum. Grow right; while the cost exceeds k, shrink left. The widest affordable window is the answer.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'k'
label = 'k'
type = 'int'
min = 0

[default_input]
nums = [1, 2, 4]
k = 5

[[tests]]
expected = '3'
[tests.input]
nums = [1, 2, 4]
k = 5

[[tests]]
expected = '2'
[tests.input]
nums = [1, 4, 8, 13]
k = 5

[[tests]]
expected = '1'
[tests.input]
nums = [3, 9, 6]
k = 2

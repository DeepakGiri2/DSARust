slug = 'sort-colors'
title = 'Sort Colors'
category = 'Arrays & Hashing'
difficulty = 'Medium'
tier = '250'
complexity = 'O(n) time · O(1) space'

description = 'Given an array with only the values 0, 1 and 2 (representing red, white and blue), sort it in place in a single pass. Watch the Dutch national flag algorithm partition the array with three pointers: everything left of low is 0, everything right of high is 2, and mid scans the unknown middle.'
approach = 'Dutch national flag with three pointers. low marks the end of the 0s, high the start of the 2s, and mid scans forward. A 0 swaps down to low (advance low and mid); a 1 stays (advance mid); a 2 swaps up to high (shrink high, re-examine mid).'

[[inputs]]
name = 'nums'
label = 'nums (values 0, 1, 2)'
type = 'int-array'
max_len = 40

[default_input]
nums = [2, 0, 2, 1, 1, 0]

[[tests]]
expected = '0 0 1 1 2 2'
[tests.input]
nums = [2, 0, 2, 1, 1, 0]

[[tests]]
expected = '0 1 2'
[tests.input]
nums = [2, 0, 1]

[[tests]]
expected = '0'
[tests.input]
nums = [0]

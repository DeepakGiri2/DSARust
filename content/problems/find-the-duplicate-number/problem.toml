slug = 'find-the-duplicate-number'
title = 'Find the Duplicate Number'
category = 'Linked List'
difficulty = 'Medium'
tier = '150'
complexity = 'O(n) time · O(1) space'

description = 'An array of n+1 integers holds values in 1..n. Exactly one value repeats. Find it without modifying the array and using constant space.'
approach = "Read the array as a linked list where i points to nums[i]. A repeated value means two indices point at the same node, so the list has a cycle, and the duplicate is its entry point — Floyd's algorithm finds it with two pointers."

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 40
min = 1
max = 20

[default_input]
nums = [1, 3, 4, 2, 2]

[[tests]]
expected = '2'
[tests.input]
nums = [1, 3, 4, 2, 2]

[[tests]]
expected = '3'
[tests.input]
nums = [3, 1, 3, 4, 2]

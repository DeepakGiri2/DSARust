slug = 'palindrome-linked-list'
title = 'Palindrome Linked List'
category = 'Linked List'
difficulty = 'Easy'
tier = '250'
leetcode = '234'
complexity = 'O(n) time · O(1) space'

description = 'Return true if a singly linked list reads the same forwards and backwards.'
approach = 'A singly linked list cannot be read backwards, so make half of it readable backwards: find the middle with slow/fast pointers, reverse the second half in place, then walk the two halves towards each other. Copying the values into an array would be easier but costs O(n) memory; this costs none.'

[[inputs]]
name = 'list'
label = 'list'
type = 'int-array'
max_len = 12
min = 0
max = 99

[default_input]
list = [1, 2, 2, 1]

[[tests]]
expected = 'true'
[tests.input]
list = [1, 2, 2, 1]

[[tests]]
expected = 'false'
[tests.input]
list = [1, 2]

[[tests]]
expected = 'true'
[tests.input]
list = [1, 2, 3, 2, 1]

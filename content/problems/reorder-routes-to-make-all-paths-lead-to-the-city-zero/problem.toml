slug = 'reorder-routes-to-make-all-paths-lead-to-the-city-zero'
title = 'Reorder Routes to Make All Paths Lead to the City Zero'
category = 'Graphs'
difficulty = 'Medium'
tier = '250'
leetcode = '1466'
complexity = 'O(n) time · O(n) space'

description = 'n cities form a tree connected by one-way roads. Return the fewest roads that must be reversed so every city can reach city 0.'
approach = 'Store every road twice — once in each direction — with a flag saying whether that direction is the original one. Then walk outwards from city 0 over the undirected tree; each edge traversed away from 0 must point *towards* 0 to be useful, so an edge whose stored direction is the original one is pointing the wrong way and has to be flipped. Summing the flags during the walk gives the answer directly.'

[[inputs]]
name = 'n'
label = 'n'
type = 'int'
min = 2
max = 8

[[inputs]]
name = 'connections'
label = 'connections'
type = 'string'
max_len = 60
help = "pairs 'a b' meaning a one-way road a→b, comma separated"

[default_input]
n = 6
connections = '0 1, 1 3, 2 3, 4 0, 4 5'

[[tests]]
expected = '3'
[tests.input]
n = 6
connections = '0 1, 1 3, 2 3, 4 0, 4 5'

[[tests]]
expected = '2'
[tests.input]
n = 5
connections = '1 0, 1 2, 3 2, 3 4'

[[tests]]
expected = '0'
[tests.input]
n = 3
connections = '1 0, 2 0'

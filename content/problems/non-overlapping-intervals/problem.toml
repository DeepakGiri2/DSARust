slug = 'non-overlapping-intervals'
title = 'Non-overlapping Intervals'
category = 'Intervals'
difficulty = 'Medium'
tier = '150'
complexity = 'O(n log n) time · O(1) space'

description = 'Return the minimum number of intervals to remove so that the rest do not overlap.'
approach = 'Sort by end time and keep greedily. Whenever two intervals clash, dropping the one that ends later is never worse — it leaves at least as much room for everything after it — so a single pass counting clashes gives the minimum.'

[[inputs]]
name = 'intervals'
label = 'intervals'
type = 'string'
max_len = 60
help = "pairs like '1,2 2,3 3,4 1,3'"

[default_input]
intervals = '1,2 2,3 3,4 1,3'

[[tests]]
expected = '1'
[tests.input]
intervals = '1,2 2,3 3,4 1,3'

[[tests]]
expected = '2'
[tests.input]
intervals = '1,2 1,2 1,2'

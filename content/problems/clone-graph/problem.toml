slug = 'clone-graph'
title = 'Clone Graph'
category = 'Graphs'
difficulty = 'Medium'
tier = '50'
complexity = 'O(V + E) time · O(V + E) space'

description = 'Given a reference to a node in a connected undirected graph, return a deep copy (clone) of the whole graph. Each node holds a value and a list of its neighbors, and the copy must share no nodes with the original.'
approach = 'DFS with a hash map from each original node to its copy. When we reach a node, if it is already in the map we return the stored copy; otherwise we create the copy and record it BEFORE recursing, so edges that loop back terminate. Then we recurse to clone every neighbor and wire them into the copy.'

[[inputs]]
name = 'adj'
label = 'edges (pairs "a,b" = undirected edge; nodes are 1-based)'
type = 'string'
max_len = 40

[default_input]
adj = '1,2 1,4 2,3 3,4'

[[tests]]
expected = "1: 2 4\n2: 1 3\n3: 2 4\n4: 1 3"
[tests.input]
adj = '1,2 1,4 2,3 3,4'

[[tests]]
expected = "1: 2 3\n2: 1 3\n3: 1 2"
[tests.input]
adj = '1,2 2,3 1,3'

[[tests]]
expected = "1: 2\n2: 1"
[tests.input]
adj = '1,2'

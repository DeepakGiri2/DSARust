slug = 'median-of-two-sorted-arrays'
title = 'Median of Two Sorted Arrays'
category = 'Binary Search'
difficulty = 'Hard'
tier = '150'
leetcode = '4'
complexity = 'O(log(min(m, n))) time · O(1) space'

description = 'Find the median of two sorted arrays without merging them.'
approach = 'Search for a *partition*, not a value. Cut both arrays so that the left pieces together hold exactly half the elements; the cut is correct when every value left of a cut is at most every value right of the other cut. Only one cut is free — the second follows from the count — so binary search runs over the shorter array, which is why the cost depends on the smaller length.'

[[inputs]]
name = 'nums1'
label = 'nums1'
type = 'int-array'
max_len = 10
min = -50
max = 50

[[inputs]]
name = 'nums2'
label = 'nums2'
type = 'int-array'
max_len = 10
min = -50
max = 50

[default_input]
nums1 = [1, 3]
nums2 = [2]

[[tests]]
expected = '2'
[tests.input]
nums1 = [1, 3]
nums2 = [2]

[[tests]]
expected = '2.5'
[tests.input]
nums1 = [1, 2]
nums2 = [3, 4]

[[tests]]
expected = '3.5'
[tests.input]
nums1 = [1, 3, 5]
nums2 = [2, 4, 6]

slug = 'find-k-pairs-with-smallest-sums'
title = 'Find K Pairs With Smallest Sums'
category = 'Heap / Priority Queue'
difficulty = 'Medium'
tier = 'extra'
leetcode = '373'
complexity = 'O(k log k) time · O(k) space'

description = 'Given two sorted arrays, return the k pairs (one element from each) with the smallest sums.'
approach = 'Think of the sums as a matrix whose rows and columns are both sorted. The k smallest entries can only ever be found on a frontier: seed the heap with the first column, and whenever a pair (i, j) is popped, push (i, j+1) — the only new candidate it unlocks. The heap therefore holds at most one entry per row, so it never grows past k, and the whole matrix is never built.'

[[inputs]]
name = 'nums1'
label = 'nums1'
type = 'int-array'
max_len = 8
min = -20
max = 30

[[inputs]]
name = 'nums2'
label = 'nums2'
type = 'int-array'
max_len = 8
min = -20
max = 30

[[inputs]]
name = 'k'
label = 'k'
type = 'int'
min = 1
max = 8

[default_input]
nums1 = [1, 7, 11]
nums2 = [2, 4, 6]
k = 3

[[tests]]
expected = '1 2 | 1 4 | 1 6'
[tests.input]
nums1 = [1, 7, 11]
nums2 = [2, 4, 6]
k = 3

[[tests]]
expected = '1 1 | 1 1'
[tests.input]
nums1 = [1, 1, 2]
nums2 = [1, 2, 3]
k = 2

[[tests]]
expected = '1 3 | 2 3'
[tests.input]
nums1 = [1, 2]
nums2 = [3]
k = 3

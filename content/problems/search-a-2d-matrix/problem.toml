slug = 'search-a-2d-matrix'
title = 'Search a 2D Matrix'
category = 'Binary Search'
difficulty = 'Medium'
tier = '150'
complexity = 'O(log(m·n)) time · O(1) space'

description = 'Each row of the matrix is sorted, and the first value of a row is greater than the last value of the row above. Return whether a target value is present.'
approach = 'Because the rows join up end to end, the matrix is one sorted list that happens to be stored in rows. Binary search over the flat index 0..m·n-1 and convert it back with row = i / cols, col = i % cols.'

[[inputs]]
name = 'matrix'
label = 'matrix'
type = 'string'
max_len = 60
help = 'rows separated by spaces, values by commas'

[[inputs]]
name = 'target'
label = 'target'
type = 'int'

[default_input]
matrix = '1,3,5,7 10,11,16,20 23,30,34,60'
target = 11

[[tests]]
expected = 'true'
[tests.input]
matrix = '1,3,5,7 10,11,16,20 23,30,34,60'
target = 11

[[tests]]
expected = 'false'
[tests.input]
matrix = '1,3,5,7 10,11,16,20 23,30,34,60'
target = 13

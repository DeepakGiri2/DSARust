slug = 'design-hashset'
title = 'Design HashSet'
category = 'Arrays & Hashing'
difficulty = 'Easy'
tier = '250'
leetcode = '705'
complexity = 'O(1) average per operation · O(n) space'

description = 'Build a set of integers supporting add, remove and contains, without using any built-in hash container.'
approach = 'A hash function turns a key into an array index, which is what makes the lookup constant time — the key itself says where to look. Different keys can land in the same slot, so each slot holds a small list and the operations scan it. Provided the buckets stay short, that scan is bounded and the whole thing behaves as O(1).'

[[inputs]]
name = 'ops'
label = 'ops'
type = 'string'
max_len = 77
help = 'add <k> / remove <k> / contains <k>, comma separated'

[default_input]
ops = 'add 1, add 2, contains 1, contains 3, add 2, contains 2, remove 2, contains 2'

[[tests]]
expected = 'true false true false'
[tests.input]
ops = 'add 1, add 2, contains 1, contains 3, add 2, contains 2, remove 2, contains 2'

[[tests]]
expected = 'true true'
[tests.input]
ops = 'add 9, add 17, contains 17, remove 9, contains 17'

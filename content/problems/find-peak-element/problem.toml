slug = 'find-peak-element'
title = 'Find Peak Element'
category = 'Binary Search'
difficulty = 'Medium'
tier = '250'
leetcode = '162'
complexity = 'O(log n) time · O(1) space'

description = 'Return the index of any peak — an element strictly greater than both of its neighbours. Elements outside the array count as negative infinity, and neighbouring values are never equal.'
approach = 'The array is not sorted, so this looks like the wrong tool — but binary search only needs a rule that discards a half *soundly*. Comparing an element with its right neighbour gives one: if it is rising, a peak must exist somewhere to the right, because the slope has to stop rising before it runs off the end. If it is falling, the same argument makes the left half (including this element) contain a peak.'

[[inputs]]
name = 'nums'
label = 'nums'
type = 'int-array'
max_len = 20
min = -50
max = 50

[default_input]
nums = [1, 2, 1, 3, 5, 6, 4]

[[tests]]
expected = '5'
[tests.input]
nums = [1, 2, 1, 3, 5, 6, 4]

[[tests]]
expected = '2'
[tests.input]
nums = [1, 2, 3, 1]

[[tests]]
expected = '0'
[tests.input]
nums = [1]

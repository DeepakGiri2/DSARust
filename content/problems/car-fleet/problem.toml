slug = 'car-fleet'
title = 'Car Fleet'
category = 'Stack'
difficulty = 'Medium'
tier = '150'
complexity = 'O(n log n) time · O(n) space'

description = 'Cars head to a target at their own speeds and cannot overtake; a faster car catching a slower one joins it and travels at the slower speed. Count how many distinct fleets arrive.'
approach = "Sort by starting position, then walk from the car nearest the target backwards. Each car's arrival time is its distance divided by its speed; a car that would arrive no later than the fleet ahead of it gets absorbed. A stack of arrival times counts the fleets that survive."

[[inputs]]
name = 'target'
label = 'target'
type = 'int'
min = 1
max = 200

[[inputs]]
name = 'position'
label = 'position'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'speed'
label = 'speed'
type = 'int-array'
max_len = 40

[default_input]
target = 12
position = [10, 8, 0, 5, 3]
speed = [2, 4, 1, 1, 3]

[[tests]]
expected = '3'
[tests.input]
target = 12
position = [10, 8, 0, 5, 3]
speed = [2, 4, 1, 1, 3]

[[tests]]
expected = '1'
[tests.input]
target = 10
position = [3]
speed = [3]

slug = 'binary-tree-zigzag-level-order-traversal'
title = 'Binary Tree Zigzag Level Order Traversal'
category = 'Trees'
difficulty = 'Medium'
tier = 'extra'
leetcode = '103'
complexity = 'O(n) time · O(n) space'

description = 'Return the level order traversal of a binary tree, alternating direction: left to right on the first level, right to left on the second, and so on.'
approach = "Plain BFS, with the direction applied at write time. The queue is always filled left to right — reversing it would break the next level's ordering — so instead each level's row is filled from the correct end: index i on a left-to-right level, size − 1 − i on a right-to-left one. No reversal, no second data structure."

[[inputs]]
name = 'tree'
label = 'tree'
type = 'tree'
max_len = 60
help = 'level order, n for a missing child'

[default_input]
tree = '3 9 20 n n 15 7'

[[tests]]
expected = '3 | 20 9 | 15 7'
[tests.input]
tree = '3 9 20 n n 15 7'

[[tests]]
expected = '1'
[tests.input]
tree = '1'

[[tests]]
expected = '1 | 3 2 | 4 5 6 7'
[tests.input]
tree = '1 2 3 4 5 6 7'

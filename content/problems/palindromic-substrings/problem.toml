slug = 'palindromic-substrings'
title = 'Palindromic Substrings'
category = '1-D Dynamic Programming'
difficulty = 'Medium'
tier = '150'
complexity = 'O(n²) time · O(1) space'

description = 'Count how many substrings of a string are palindromes. Substrings at different positions count separately.'
approach = 'Expand around each of the 2n-1 centres, exactly as for the longest palindrome — but count every successful expansion instead of keeping the largest. Each step outwards that still matches is one more palindrome.'

[[inputs]]
name = 's'
label = 's'
type = 'string'
max_len = 20

[default_input]
s = 'aaa'

[[tests]]
expected = '6'
[tests.input]
s = 'aaa'

[[tests]]
expected = '3'
[tests.input]
s = 'abc'

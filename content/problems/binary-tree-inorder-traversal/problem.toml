slug = 'binary-tree-inorder-traversal'
title = 'Binary Tree Inorder Traversal'
category = 'Trees'
difficulty = 'Easy'
tier = '250'
leetcode = '94'
complexity = 'O(n) time · O(h) space (h = height)'

description = "Return the values of a binary tree's nodes in inorder — left subtree, node, right subtree."
approach = 'The iterative form, because it makes the rule visible. Walk left as far as possible, stacking every node passed on the way; a node is only recorded once its entire left side is exhausted, and after recording it the walk resumes from its right child. The stack is exactly the set of ancestors whose left side is still unfinished.'

[[inputs]]
name = 'root'
label = "tree (level-order, 'n' = null)"
type = 'tree'
max_len = 80

[default_input]
root = '4 2 7 1 3 6 9'

[[tests]]
expected = '1 2 3 4 6 7 9'
[tests.input]
root = '4 2 7 1 3 6 9'

[[tests]]
expected = '1 3 2'
[tests.input]
root = '1 n 2 3'

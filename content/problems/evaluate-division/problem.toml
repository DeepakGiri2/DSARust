slug = 'evaluate-division'
title = 'Evaluate Division'
category = 'Graphs'
difficulty = 'Medium'
tier = 'extra'
leetcode = '399'
complexity = 'O(queries × (nodes + edges)) time · O(nodes + edges) space'

description = 'Given equations like a / b = 2.0, answer queries like a / c. Return -1 for a query naming an unknown variable or one with no chain of equations connecting the two.'
approach = "Every equation is a weighted edge both ways: a → b with weight 2 and b → a with weight 1/2. A quotient is then the product of the weights along any path, so each query is a graph search multiplying as it goes. The problem's real content is recognising that division is a graph at all — after that it is ordinary DFS with a visited set."

[[inputs]]
name = 'equations'
label = 'equations'
type = 'string'
max_len = 60
help = 'a/b=2.0, b/c=3.0'

[[inputs]]
name = 'queries'
label = 'queries'
type = 'string'
max_len = 60
help = 'a/c, b/a, a/e, a/a, x/x'

[default_input]
equations = 'a/b=2, b/c=3'
queries = 'a/c, b/a, a/e, a/a, x/x'

[[tests]]
expected = '6.00 0.50 -1 1.00 -1'
[tests.input]
equations = 'a/b=2, b/c=3'
queries = 'a/c, b/a, a/e, a/a, x/x'

[[tests]]
expected = '2.00 0.50'
[tests.input]
equations = 'a/b=2'
queries = 'a/b, b/a'

[[tests]]
expected = '-1 3.00'
[tests.input]
equations = 'a/b=3, c/d=4'
queries = 'a/d, a/b'

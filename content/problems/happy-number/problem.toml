slug = 'happy-number'
title = 'Happy Number'
category = 'Math & Geometry'
difficulty = 'Easy'
tier = '150'
complexity = 'O(log n) per step · O(1) space'

description = 'Repeatedly replace a number by the sum of the squares of its digits. It is happy if this reaches 1; otherwise the process loops forever.'
approach = "The sequence is a linked list of numbers, so an unhappy number means a cycle — and Floyd's tortoise and hare detects it in constant space. A set of seen numbers also works, but costs memory."

[[inputs]]
name = 'n'
label = 'n'
type = 'int'
min = 1
max = 999

[default_input]
n = 19

[[tests]]
expected = 'true'
[tests.input]
n = 19

[[tests]]
expected = 'false'
[tests.input]
n = 4

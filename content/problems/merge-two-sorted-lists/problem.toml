slug = 'merge-two-sorted-lists'
title = 'Merge Two Sorted Lists'
category = 'Linked List'
difficulty = 'Easy'
tier = '50'
complexity = 'O(n + m) time · O(1) space'

description = 'You are given the heads of two sorted linked lists list1 and list2. Splice them together into one sorted list and return its head.'
approach = 'Keep a dummy head and a tail pointer. Walk both lists with p1 and p2; repeatedly append the smaller head to tail and advance that pointer. When one list runs out, attach the remaining (already sorted) tail of the other.'

[[inputs]]
name = 'list1'
label = 'list1 (sorted)'
type = 'int-array'
max_len = 40

[[inputs]]
name = 'list2'
label = 'list2 (sorted)'
type = 'int-array'
max_len = 40

[default_input]
list1 = [1, 2, 4]
list2 = [1, 3, 4]

[[tests]]
expected = '1 1 2 3 4 4'
[tests.input]
list1 = [1, 2, 4]
list2 = [1, 3, 4]

[[tests]]
expected = ''
[tests.input]
list1 = []
list2 = []

[[tests]]
expected = '1 2 3 5'
[tests.input]
list1 = [5]
list2 = [1, 2, 3]

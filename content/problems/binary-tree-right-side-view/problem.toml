slug = 'binary-tree-right-side-view'
title = 'Binary Tree Right Side View'
category = 'Trees'
difficulty = 'Medium'
tier = '150'
complexity = 'O(n) time · O(n) space (the queue)'

description = 'Imagine standing to the right of a binary tree — return the values of the nodes you can see, ordered from top to bottom. Exactly one node is visible per level: the last node in a left-to-right breadth-first pass of that level.'
approach = 'Breadth-first search level by level. On each outer pass, record the current queue size — that is one whole level — then dequeue that many nodes left to right, and keep the value of the LAST one (i == size-1) as the node visible from the right.'

[[inputs]]
name = 'root'
label = "tree (level-order, 'n' = null)"
type = 'tree'
max_len = 40

[default_input]
root = '1 2 3 n 5 n 4'

[[tests]]
expected = '1 3 4'
[tests.input]
root = '1 2 3 n 5 n 4'

[[tests]]
expected = '1 3'
[tests.input]
root = '1 2 3'

[[tests]]
expected = '1'
[tests.input]
root = '1'

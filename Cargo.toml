[workspace]
resolver = "2"
members = [
    "crates/dsa-core",
    "crates/dsa-content",
    "crates/dsa-viz",
    "crates/dsa-harness",
    "crates/dsa-ai",
    "crates/dsa-store",
    "crates/dsa-app",
    "crates/xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/deepak/dsa-visualized"

[workspace.dependencies]
dsa-core = { path = "crates/dsa-core" }
dsa-content = { path = "crates/dsa-content" }
dsa-viz = { path = "crates/dsa-viz" }
dsa-harness = { path = "crates/dsa-harness" }
dsa-ai = { path = "crates/dsa-ai" }
dsa-store = { path = "crates/dsa-store" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rhai = { version = "1.25", features = ["sync", "serde"] }
# `bundled` compiles SQLite from source, so progress tracking needs no system
# library and the packaged binary keeps working on a machine that has none.
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
walkdir = "2"
directories = "6"
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.33", features = ["syntect"] }
# Only for the --screenshot developer flag; already in the tree via egui_extras.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
tempfile = "3"
which = "7"
ureq = { version = "3", features = ["json"] }

# Release profile tuned for a distributable desktop binary on every platform.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Scripts and traces run in debug builds too — keep dependencies optimized so
# authoring (hot-reload) stays responsive without a release build.
[profile.dev.package."*"]
opt-level = 2

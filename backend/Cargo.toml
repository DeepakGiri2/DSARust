# DSA Visualized — cloud backend.
#
# A workspace of its own, deliberately separate from the desktop app in `../`:
# it has its own lockfile, its own dependency graph (no egui, no SQLite) and its
# own release cadence. What it shares with the desktop is the part that must
# never drift — the trace model and the Rhai content engine — which it takes
# from `../crates` by path, so all 287 animations run byte-for-byte the same.
#
#   dsa-api       stateless HTTP API (axum + PostgreSQL), horizontally scaled
#   dsa-runner    sandboxed code execution (AWS Lambda container / HTTP worker)
#   dsa-protocol  the wire contract between the two

[workspace]
resolver = "2"
members = ["crates/api", "crates/runner", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/DeepakGiri2/DSARust"

[workspace.dependencies]
# ── shared with the desktop app (single source of truth) ────────────────────
dsa-core = { path = "../crates/dsa-core" }
dsa-content = { path = "../crates/dsa-content" }
dsa-harness = { path = "../crates/dsa-harness" }
dsa-ai = { path = "../crates/dsa-ai" }
dsa-protocol = { path = "crates/protocol" }

# ── async + http ────────────────────────────────────────────────────────────
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8", features = ["macros", "http2"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed"] }
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "compression-gzip",
    "compression-br",
    "request-id",
    "timeout",
    "limit",
    "set-header",
    "catch-panic",
    "sensitive-headers",
    "util",
] }
http = "1"
http-body-util = "0.1"
hyper = "1"
bytes = "1"
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "gzip",
] }

# ── data ────────────────────────────────────────────────────────────────────
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "time",
    "json",
    "migrate",
    "macros",
] }
redis = { version = "0.29", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "tokio-rustls-comp",
] }
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "macros", "formatting", "parsing"] }

# ── security ────────────────────────────────────────────────────────────────
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
base64 = "0.22"
hex = "0.4"

# ── ops ─────────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
url = "2"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "hostname",
] }

# ── AWS (feature-gated in the crates that use them) ─────────────────────────
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-lambda = "1"
aws-sdk-sesv2 = "1"
aws-sdk-bedrockruntime = "1"
lambda_runtime = "1"

# ── sandbox (Linux-only target dependencies of dsa-runner) ─────────────────
libc = "0.2"
seccompiler = "0.5"

# ── test ────────────────────────────────────────────────────────────────────
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# A panic in one request must not take the whole server down: tower-http's
# CatchPanic turns it into a 500. That needs unwinding, so no `panic = "abort"`.

[profile.dev.package."*"]
opt-level = 2
